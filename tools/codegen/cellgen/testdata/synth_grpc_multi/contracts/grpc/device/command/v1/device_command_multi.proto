syntax = "proto3";
package device.command.v1;
option go_package = "github.com/ghbvf/gocell/generated/contracts/grpc/device/command/v1;commandv1";
service DeviceCommandService {
  rpc IssueCommand(IssueCommandRequest) returns (IssueCommandResponse) {}
  rpc WatchCommands(WatchCommandsRequest) returns (stream WatchCommandsResponse) {}
  rpc CancelCommand(CancelCommandRequest) returns (CancelCommandResponse) {}
}
message IssueCommandRequest { string device_id = 1; }
message IssueCommandResponse { string ack_id = 1; }
message WatchCommandsRequest { string device_id = 1; }
message WatchCommandsResponse { string command_id = 1; }
message CancelCommandRequest { string command_id = 1; }
message CancelCommandResponse { bool ok = 1; }
