id: http.sample.responseprojectionlist.v1
kind: http
ownerCell: testcell
consistencyLevel: L0
lifecycle: active
codegen: true
endpoints:
  server: testcell
  http:
    method: GET
    path: /api/v1/sample/projection-list
    successStatus: 200
    noContent: false
    responseProjection: true
    responses:
      400:
        description: Bad Request
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
