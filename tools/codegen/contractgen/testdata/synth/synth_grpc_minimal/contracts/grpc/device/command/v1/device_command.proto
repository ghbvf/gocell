// Synth fixture proto for synth_grpc_minimal (contractgen golden + registry
// tests). Mirrors the docs example-unary shape but uses the REAL module path so
// the rendered import matches what buf would emit. Consumed by the contractgen
// ProtoReader (go_package + rpc line scan), NOT by buf/protoc — no .pb.go is
// produced in PR 6 (deferred to PR 8). The leading comments + inline `rpc {}`
// braces exercise the reader's comment-stripping path.

syntax = "proto3";

package device.command.v1;

option go_package = "github.com/ghbvf/gocell/generated/contracts/grpc/device/command/v1;commandv1";

service DeviceCommandService {
  // IssueCommand pushes a state change to a device.
  rpc IssueCommand(IssueCommandRequest) returns (IssueCommandResponse) {}
}

message IssueCommandRequest {
  string device_id    = 1;
  string command_type = 2; // e.g. "lock", "reboot"
  bytes  payload      = 3;
}

message IssueCommandResponse {
  string ack_id                    = 1;
  int64  acknowledged_at_unix_nano = 2;
}
