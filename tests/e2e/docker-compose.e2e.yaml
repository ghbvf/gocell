# 4-service real-PG e2e harness for PR-CFG-G1+ era.
# postgres + redis + migrate (one-shot) + corebundle (real adapter mode).
# corebundle waits on migrate completion + redis readiness.
#
# PR-CFG-G1: replaces the demo+memory single-service harness. accesscore and
# auditcore are now wired with real outbox writers via the shared PG pool
# (committed in PR-CFG-G1 commits 1-3), so DurabilityDurable mode works
# end-to-end. The 4 TestE2E_ConfigEncryption_* tests are unskipped by setting
# GOCELL_E2E_PG_AVAILABLE=1 in the CI workflow.
#
# !!! ALL VALUES IN THIS FILE ARE EPHEMERAL CI/E2E FIXTURES !!!
# Every secret-shaped string below (POSTGRES_PASSWORD, GOCELL_*_KEY,
# GOCELL_SERVICE_SECRET, GOCELL_METRICS_TOKEN, GOCELL_READYZ_VERBOSE_TOKEN, …)
# is a placeholder used only by the docker-compose harness during one
# CI run. They are NOT production secrets, NOT shared with any deployed
# environment, and the postgres volume is destroyed by `docker compose
# down -v` after each run. Production deployments inject all of these
# via secret managers (Vault, GH Secrets, etc.) — never reuse these
# values outside the e2e harness.

# SEC-FAIL-CLOSED (PR-MODE-1): all 4 services share network_mode: host so that
# corebundle reaches Redis/Postgres at 127.0.0.1, satisfying the loopback
# exception in pkg/secutil.ValidateTLSEndpoint without operating a TLS-enabled
# Redis container. Host networking is supported on Linux runners (CI uses
# ubuntu-latest); macOS Docker Desktop does not honour it, so the e2e harness
# is Linux-only by construction. Production deployments connect to managed
# Redis/Postgres over TLS scheme URLs (rediss://, postgres+ssl); this fixture
# is not a deployment template.
services:
  postgres:
    image: postgres:15-alpine
    network_mode: host
    environment:
      POSTGRES_USER: gocell
      # Required env: caller MUST export E2E_PG_PASSWORD before `docker compose up`.
      # No default — software-fallback would re-introduce a hardcoded credential.
      # CI workflow declares it (.github/workflows/_build-lint.yml::e2e env block);
      # local devs use tests/e2e/.env.e2e.example as a starting point.
      POSTGRES_PASSWORD: ${E2E_PG_PASSWORD:?E2E_PG_PASSWORD must be set}
      POSTGRES_DB: gocell
      GOCELL_APP_PASSWORD: ${GOCELL_APP_PASSWORD:?E2E GOCELL_APP_PASSWORD must be set}
    volumes:
      - ../../deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocell -d gocell"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  # RabbitMQ: postgres (durable) topology wires a real broker as the outbox
  # transport (#1940) — corebundle fail-closes at startup without GOCELL_AMQP_URL.
  # Default guest:guest@127.0.0.1:5672 under host networking; e2e-only fixture.
  rabbitmq:
    image: rabbitmq:3-alpine
    network_mode: host
    healthcheck:
      # check_port_connectivity (not -q ping): ping only confirms the Erlang node
      # is up, which happens BEFORE the AMQP 5672 listener binds — corebundle's
      # eager dial then gets "connection refused" and fail-closes (#1940). This
      # check verifies the listener ports actually accept connections, mirroring
      # the testcontainers wait.ForListeningPort(5672) the integration tests use.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  migrate:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.migrate
    network_mode: host
    environment:
      GOCELL_PG_DSN: postgres://gocell:${E2E_PG_PASSWORD:?E2E_PG_PASSWORD must be set}@127.0.0.1:5432/gocell?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  corebundle:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.corebundle
    network_mode: host
    environment:
      # Topology: real adapter mode + postgres storage backend.
      GOCELL_ADAPTER_MODE: real
      GOCELL_CELL_ADAPTER_MODE: postgres
      # Single-pod deployment: in-memory nonce store is sufficient.
      GOCELL_SINGLE_POD: "1"

      # PostgreSQL DSN — per-cell (#1964 per-cell PG seam). All three cells share
      # the same DSN in this colocated deployment; percellpg.Resolve deduplicates
      # to one pool (a missing DSN or >1 distinct DSN fails fast at startup).
      GOCELL_CONFIGCORE_DATABASE_URL: postgres://gocell_app:${GOCELL_APP_PASSWORD:?GOCELL_APP_PASSWORD must be set}@127.0.0.1:5432/gocell?sslmode=disable
      GOCELL_AUDITCORE_DATABASE_URL: postgres://gocell_app:${GOCELL_APP_PASSWORD:?GOCELL_APP_PASSWORD must be set}@127.0.0.1:5432/gocell?sslmode=disable
      GOCELL_ACCESSCORE_DATABASE_URL: postgres://gocell_app:${GOCELL_APP_PASSWORD:?GOCELL_APP_PASSWORD must be set}@127.0.0.1:5432/gocell?sslmode=disable
      GOCELL_CONFIGCORE_KEY_PROVIDER: local-aes
      # 64-hex-char = 32 bytes. E2e-only; never reuse in production.
      GOCELL_CONFIGCORE_MASTER_KEY: aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899
      GOCELL_CONFIGCORE_CURSOR_KEY: config-cursor-key-32b-e2e-padded!

      # auditcore cell: HMAC + cursor keys.
      GOCELL_AUDITCORE_HMAC_KEY: audit-hmac-key-e2e-replace-32b!!!
      GOCELL_AUDIT_BOOTSTRAP_HMAC_KEY: bootstrap-hmac-key-e2e-replace-32b!
      GOCELL_AUDITCORE_CURSOR_KEY: audit-cursor-key-32b-e2e-padded!

      # accesscore cell: cursor key.
      GOCELL_ACCESSCORE_CURSOR_KEY: access-cursor-key-32b-e2e-padx!!
      # accesscore cell: client-IP hash salt (≥32 bytes, #1488). Real-mode required.
      GOCELL_ACCESSCORE_IP_HASH_SALT: access-ip-hash-salt-32b-e2e-pad!!

      # Redis for distributed replay protection and outbox claimer. Loopback
      # host under host-network topology — ValidateTLSEndpoint loopback exception.
      GOCELL_REDIS_ADDR: 127.0.0.1:6379

      # RabbitMQ outbox event transport (#1940): postgres topology publishes the
      # outbox relay to a real broker (not the in-process bus). Required in
      # postgres+real mode — corebundle fail-closes without it. Loopback host
      # under host-network topology.
      GOCELL_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/

      # Production control-plane tokens (e2e-only values; not secret material).
      GOCELL_SERVICE_SECRET: e2e-service-secret-32-bytes-xxxxx!
      GOCELL_METRICS_TOKEN: e2e-metrics-token
      # Verbose readyz token — required in real-adapter mode (validateControlPlane
      # rejects GOCELL_READYZ_VERBOSE_DISABLED=1 on real). Token-gated /readyz?verbose
      # stays available for on-call diagnostics; tests do not exercise it.
      GOCELL_READYZ_VERBOSE_TOKEN: e2e-readyz-verbose-token-32-bytes!

      # JWT identity and audience.
      GOCELL_JWT_ISSUER: gocell-e2e
      GOCELL_JWT_AUDIENCE: gocell-e2e-clients

      # HTTP listener addresses — corebundle container (host network: ports
      # bind directly on the runner; no docker port mapping needed).
      GOCELL_HTTP_PRIMARY_ADDR: "0.0.0.0:8080"
      GOCELL_HTTP_INTERNAL_ADDR: "127.0.0.1:9090"
      # 0.0.0.0 required for CI host-side WaitForReady; production must bind to 127.0.0.1
      GOCELL_HTTP_HEALTH_ADDR: "0.0.0.0:9091"

      # Admin provisioning: operator calls POST /setup/admin protected by HTTP
      # Basic Auth using the bootstrap credentials in env_file below.
      # The bootstrap-admin.sh step calls that endpoint immediately after
      # corebundle's healthcheck passes; both sides read GOCELL_BOOTSTRAP_ADMIN_*
      # from tests/e2e/scripts/bootstrap-credentials.env (single source of truth).
    env_file:
      - ./scripts/bootstrap-credentials.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
