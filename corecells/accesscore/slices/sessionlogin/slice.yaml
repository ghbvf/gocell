id: sessionlogin
belongsToCell: accesscore
consistencyLevel: L2
lifecycle: asset
contractUsages:
  - contract: http.auth.login.v1
    role: serve
  - contract: event.session.created.v1
    role: publish
  - contract: event.user.locked.v1
    role: publish
  - contract: event.user.unlocked.v1
    role: publish
  - contract: http.config.get.v1
    role: call
verify:
  unit:
    - unit.sessionlogin.service
  contract:
    - contract.http.auth.login.v1.serve
    - contract.event.session.created.v1.publish
    - contract.event.user.locked.v1.publish
    - contract.event.user.unlocked.v1.publish
  waivers:
    - contract: http.config.get.v1
      owner: platform-team
      reason: "只读配置调用，集成测试已覆盖；waiver 由 #1467 续期解阻塞 develop CI，补测试还债见 #1472"
      expiresAt: 2026-09-01

allowedFiles:
  - corecells/accesscore/slices/sessionlogin/**
