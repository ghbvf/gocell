id: corebundle
cells:
  - configcore
  - auditcore
  - accesscore
  - syscore
owner:
  team: platform-core
  role: maintainer
# Per-deployment serving opt-in for framework-owned contracts (ownerCell: _framework).
# corebundle is the platform assembly that serves the neutral device contracts.
# http.devicestate.v1 (L0 device presence query) is the first active framework
# contract (PR-8a / #2037); the framework RouteGroup is mounted at bootstrap and
# this list is the codegen/governance single source (ADR 202606130635-1939).
# The deviceidentity EST front-end (PR-8b / #1904) adds the synchronous enroll /
# renew / cacerts issuance endpoints (RFC 7030 style, JSON-native): enroll +
# cacerts mount on the primary listener, renew on the dedicated device-mTLS
# listener.
frameworkContracts:
  - http.devicestate.v1
  - http.deviceidentity.enroll.v1
  - http.deviceidentity.renew.v1
  - http.deviceidentity.cacerts.v1
build:
  compositionAPI: true
