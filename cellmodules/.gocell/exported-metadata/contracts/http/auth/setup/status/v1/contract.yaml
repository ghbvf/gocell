id: http.auth.setup.status.v1
kind: http
ownerCell: accesscore
consistencyLevel: L0
lifecycle: active
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/access/setup/status
    headers:
      # X-Tenant-ID carries the pre-bootstrap tenant scope (no JWT yet).
      # Populate-only at codegen → merged into the generated Request field; the
      # setup status adapter parses it via tenant.ParseTenantID and a missing /
      # malformed value fails SOFT to 200 {hasAdmin:false} (same shape as "not yet
      # provisioned") to deny an unauthenticated tenant-existence oracle (ADR 1160
      # — adapter-owned fail-soft, deliberately not a codegen gate).
      X-Tenant-ID:
        type: string
        format: uuid
        required: true
    successStatus: 200
    noContent: false
    responseProjection: true
    auth:
      public: true
      reason: "Pre-auth bootstrap status probe: reports whether first-admin provisioning is complete, before any JWT exists."
    responses:
      400:
        description: "Bad request — malformed JSON body or oversized payload (from co-located setup admin handler)"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit (from co-located setup admin handler)"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      500:
        description: "Internal — provisioner status check failed (e.g. database unreachable). Body is the standard error envelope; the underlying cause is logged at slog.Error and not exposed on the wire."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
