# GoCell workspace manifest — declares the monorepo's metadata footprint across
# every go.work member module that carries GoCell metadata.
#
# WHY EXPLICIT includes: the Locator auto-detects this file and switches every
# `gocell` command (validate / generate / codegen-drift gates) from conventional
# to manifest mode. A minimal `modules: [{path: .}]` would use the top-level-only
# defaults and SILENTLY DROP the entire examples/ subtree from governance scope.
# These patterns mirror kernel/metadata/locator_conventional.go's matchers
# (corecells/<id>/ + examples/<id>/ branch) so manifest-mode discovery is
# byte-identical to conventional mode FOR THE COMMITTED TREE. The equivalence is
# machine-guarded by kernel/metadata/locator_equivalence_test.go.
#
# ONE deliberate divergence (#1560): conventional mode also scans the
# framework-general root cells/<id>/ convention, but this root module does NOT
# declare it — GoCell's own platform cells live in the corecells module and the
# repo holds ZERO root cells, so a `cells:` include here would fail-closed on
# zero match (see below). Equivalence therefore holds only because root cells/ is
# empty on the committed tree; a consumer who scaffolds a cell at root cells/ must
# run conventional mode (no manifest) — which is why hack/verify-scaffold-assembly.sh
# passes --layout=conventional. This is the intended split semantics, not a bug.
#
# Fail-closed: with explicit `includes:`, if a kind's patterns match zero files,
# `gocell validate` FAILS (hard error) — so deleting the last file of a kind
# requires removing the corresponding `includes:` entry from this manifest.
#
# MULTI-MODULE (#1556, go.work P1): each example that carries metadata AND is its
# own go.work member declares its own module entry below with module-RELATIVE
# include globs (the Locator joins them onto modules[].path). go.work is the
# authoritative Go module set; tools/workspace cross-checks BOTH directions and
# fails closed: manifest.modules ⊆ go.work.use, AND every go.work member carrying
# GoCell metadata MUST appear here. So extracting a metadata-bearing example into
# a module requires (1) a go.work `use` line and (2) a module entry here — in the
# SAME change, or the cross-check goes red.
#   - examples/ssobff + examples/corebundlestarter are go.work members but carry
#     NO GoCell metadata (hand-wired assemblies), so they legitimately stay out
#     of this manifest (the reverse cross-check exempts metadata-free members).
#   - examples/demo is now a satellite module like todoorder/iotdevice/
#     orderfulfillment (#1644): it has its own go.mod + go.work `use` line and
#     declares its own module entry below with module-relative include globs.
version: v1
modules:
  - path: .
    includes:
      contracts:
        - "contracts/**/contract.yaml"
      journeys:
        - "journeys/J-*.yaml"
      assemblies:
        - "assemblies/*/assembly.yaml"
      actors: "actors.yaml"
      statusBoard: "journeys/status-board.yaml"
  # corecells is GoCell's own platform-cell module (#1560 go.work P5): a go.work
  # member carrying cell/slice metadata, so it MUST appear here (reverse
  # cross-check). Its cells live DIRECTLY under the module root (corecells/<id>/),
  # so the module-relative include globs have no cells/ infix — unlike the root
  # module (which no longer holds platform cells) or examples/<id> below.
  # contracts/journeys/assemblies intentionally stay in the root module
  # (path: .) and are not declared under this entry.
  - path: corecells
    includes:
      cells:
        - "*/cell.yaml"
      slices:
        - "*/slices/*/slice.yaml"
  - path: examples/todoorder
    includes:
      cells:
        - "cells/*/cell.yaml"
      slices:
        - "cells/*/slices/*/slice.yaml"
      contracts:
        - "contracts/**/contract.yaml"
      journeys:
        - "journeys/J-*.yaml"
      assemblies:
        - "assembly.yaml"
  - path: examples/iotdevice
    includes:
      cells:
        - "cells/*/cell.yaml"
      slices:
        - "cells/*/slices/*/slice.yaml"
      contracts:
        - "contracts/**/contract.yaml"
      assemblies:
        - "assembly.yaml"
  - path: examples/orderfulfillment
    includes:
      cells:
        - "cells/*/cell.yaml"
      slices:
        - "cells/*/slices/*/slice.yaml"
      contracts:
        - "contracts/**/contract.yaml"
      journeys:
        - "journeys/J-*.yaml"
      assemblies:
        - "assembly.yaml"
  - path: examples/demo
    includes:
      cells:
        - "cells/*/cell.yaml"
      slices:
        - "cells/*/slices/*/slice.yaml"
      contracts:
        - "contracts/**/contract.yaml"
      assemblies:
        - "assembly.yaml"
  - path: examples/webhookdemo
    includes:
      cells:
        - "cells/*/cell.yaml"
      slices:
        - "cells/*/slices/*/slice.yaml"
      contracts:
        - "contracts/**/contract.yaml"
      assemblies:
        - "assembly.yaml"
