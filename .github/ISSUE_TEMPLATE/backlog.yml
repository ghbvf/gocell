name: Backlog item
description: 新增 backlog 条目 — 落入 Project v2 "GoCell Backlog"
title: "[<ID>] <简短标题>"
labels: ["backlog"]
body:
  - type: markdown
    attributes:
      value: |
        建后请追加 labels（除 `backlog` 与下方 Priority 自动贴外）：
        - **cap-XX**（1 个）：cap-01..cap-14 或 cap-x-cross
        - **flag-XX**（1 个）：flag-hard / flag-cond / flag-soft / flag-planned
        - **type-XX**（1 个）：type-feat / type-bug / type-refactor / type-arch-opt / type-doc / type-test / type-debt / type-fu

        Priority 由下方 dropdown + `.github/workflows/auto-label-priority.yml` 自动贴 `pri-pX` label。
        Project v2 字段（Status / Estimate）建后在 Project UI table view 设。
        Schema 详见 [`docs/backlog.md`](../blob/develop/docs/backlog.md)。

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 选一档；workflow 会贴对应 `pri-pX` label。P0 红线见 `docs/backlog/20260520/RERATING-RUBRIC.md` §"P0 红线"，仅 incident-driven。
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: status-quo
    attributes:
      label: 现状
      description: 当前代码状态 / 已落地 / 已尝试方案
      placeholder: "<现状描述>"
    validations:
      required: true

  - type: textarea
    id: fix-direction
    attributes:
      label: 修复方向
      description: 设计思路 / 替代方案 / 范围
      placeholder: "<修复方向>"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files
      description: 主要涉及文件 (≤3)
      placeholder: |
        - path/to/file1.go
        - path/to/file2.go
    validations:
      required: false

  - type: textarea
    id: trigger
    attributes:
      label: Trigger
      description: 仅 Project Flag=cond 时必填 — 触发条件文本
      placeholder: "触发条件"
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source
      description: 来源 (PR# / review path / issue#)
      placeholder: "PR #NNN / docs/reviews/..."
    validations:
      required: false
