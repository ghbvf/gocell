name: Backlog item
description: 新增 backlog 条目 — 落入 Project v2 "GoCell Backlog" #3
title: "[<ID>] <简短标题>"
labels: ["backlog"]
body:
  - type: markdown
    attributes:
      value: |
        建后请追加 labels（除 `backlog` 与下方 Priority 自动贴外）：
        - **area-XX**（1 个）：area-kernel / area-auth / area-http / area-eventing / area-data / area-observability / area-tooling / area-cross
        - **type-XX**（1 个）：type-feat / type-bug / type-refactor / type-arch-opt / type-doc / type-test / type-debt / type-fu
        - **flag-cond**（可选）：条件延后型条目加此 label，并填下方 Trigger 段

        CLI 追加示例：`gh issue edit <N> --add-label area-eventing --add-label type-bug`

        Priority 由下方 dropdown + `.github/workflows/auto-label-priority.yml` 自动贴 `pri-pX` label。
        Status / Estimate（Cx1-4）/ Wave 建后在 Project v2 UI 设。
        真源 = GitHub Issues + Project v2 #3；label 体系 / 字段 / 评级 rubric 见 [`.github/PROJECT.md`](../blob/develop/.github/PROJECT.md)。

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 选一档；workflow 会贴对应 `pri-pX` label。P0 红线仅 incident-driven（线上故障 / 数据完整性破坏 / 安全 CVE），见 `.github/PROJECT.md` §评级 rubric。
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: status-quo
    attributes:
      label: 现状
      description: 当前代码状态 / 已落地 / 已尝试方案
      placeholder: "<现状描述>"
    validations:
      required: true

  - type: textarea
    id: fix-direction
    attributes:
      label: 修复方向
      description: 设计思路 / 替代方案 / 范围
      placeholder: "<修复方向>"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files
      description: 主要涉及文件 (≤3)
      placeholder: |
        - path/to/file1.go
        - path/to/file2.go
    validations:
      required: false

  - type: textarea
    id: trigger
    attributes:
      label: Trigger
      description: 仅条件延后型条目必填 — 触发条件文本（什么事件 / PR 发生后才动手）
      placeholder: "触发条件"
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source
      description: 来源 (PR# / review path / issue#)
      placeholder: "PR #NNN / docs/reviews/..."
    validations:
      required: false
