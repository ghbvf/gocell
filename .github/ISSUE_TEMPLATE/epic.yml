name: Epic
description: 跨多 PR 的能力级工作项 — 父 issue，挂子任务 + wave 实施顺序
title: "[EPIC] <能力级标题>"
labels: ["epic", "backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Epic = 跨多 PR 的能力级工作项。建后请追加 **area-XX**（1 个，主领域）+ Priority dropdown 自动贴 `pri-pX`。

        子任务用 GitHub 原生 **sub-issue** 关联（issue 页右栏 "Create sub-issue" 或 `gh`），不要在 body 里手写 task list。
        wave 实施顺序由 `/pm-epic` 技能拓扑排序后写入 **Project v2 Wave 字段** + 回填下方「实施顺序」段。
        真源 = GitHub Issues + Project v2 #3；详见 [`.github/PROJECT.md`](../blob/develop/.github/PROJECT.md)。

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: epic 整体优先级；workflow 贴 `pri-pX`。
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标 / 范围
      description: 这个 epic 要达成什么能力级结果，边界在哪
      placeholder: "<目标与范围>"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: epic 完成的可验证判定（所有子任务 close + 何种端到端能力可用）
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: implementation-order
    attributes:
      label: 实施顺序（由 /pm-epic 维护）
      description: wave 拓扑排序结果，/pm-epic 重生成此段；初次可留空
      placeholder: |
        Wave 1: #aaa, #bbb
        Wave 2: #ccc（blocked-by #aaa）
    validations:
      required: false
