version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      golangci-lint:
        patterns:
          - "golangci/golangci-lint-action"
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-testcontainers:
        patterns:
          - "github.com/testcontainers/testcontainers-go*"
      go-opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      go-x-modules:
        patterns:
          - "golang.org/x/*"
      go-other-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/testcontainers/testcontainers-go*"
          - "go.opentelemetry.io/*"
          - "golang.org/x/*"
    ignore:
      # gofumpt 必须锁定在 pinned golangci-lint release 内 vendor 的版本
      # （golangci-lint v2.11.4 vendors gofumpt v0.9.2）。go.mod 的 gofumpt
      # 与 golangci-lint 内 vendor 的 gofumpt 版本一旦分裂，producer 侧
      # （tools/codegen 调用 gofumpt.Source）与 CI formatter gate
      # （golangci-lint 内 vendor 的同包）会对同一 diff 应用不同格式化规则
      # → CI 必红 / codegen drift。仅当同步升级 golangci-lint 时才解锁
      # （见 hack/lib/golangci-lint.sh 的 SYNC 契约）。PR #534 / #910 均因
      # 自动升级到 v0.10.0 被回滚。
      - dependency-name: "mvdan.cc/gofumpt"

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    groups:
      go-x-modules:
        patterns:
          - "golang.org/x/*"
      go-other-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "golang.org/x/*"
    ignore:
      # keep in sync with the root gomod entry: gofumpt is pinned to the
      # version vendored by the pinned golangci-lint release.
      - dependency-name: "mvdan.cc/gofumpt"
