version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # NOTE (#2160): since #1565/#2125 no workflow `uses:` golangci/golangci-lint-action
      # — the real golangci-lint pin is now hack/lib/golangci-lint.sh::GOLANGCI_LINT_VERSION
      # (a `go install @version` shell literal, absent from any go.mod), so neither this
      # github-actions group nor the gomod ecosystem auto-bumps it: golangci-lint version
      # upgrades are MANUAL by accepted decision pending #2160. This group is retained as a
      # placeholder (and to satisfy DEPENDABOT-COVERAGE-GOLANGCI-01) until #2160 decides
      # whether to redirect coverage to the real pin source; it is NOT a merge condition of
      # PR #2158 (the archtest-convergence PR), which deliberately leaves this state as-is.
      golangci-lint:
        patterns:
          - "golangci/golangci-lint-action"
      github-actions:
        patterns:
          - "*"

  # CLI release image base (cmd/gocell/Dockerfile). Keeps the pinned distroless
  # digest current so a digest pin never silently goes stale and misses upstream
  # security patches (#1088 review F4).
  - package-ecosystem: "docker"
    directory: "/cmd/gocell"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/cellmodules"
      - "/cmd/corebundle"
      - "/cmd/gocell"
      - "/corecells"
      - "/examples/corebundlestarter"
      - "/examples/demo"
      - "/examples/iotdevice"
      - "/examples/orderfulfillment"
      - "/examples/ssobff"
      - "/examples/todoorder"
      - "/examples/webhookdemo"
      - "/tests/integration"
      - "/tests/testutil/pgshare"
      - "/tools"
    schedule:
      interval: "weekly"
    groups:
      go-testcontainers:
        group-by: dependency-name
        patterns:
          - "github.com/testcontainers/testcontainers-go*"
      go-opentelemetry:
        group-by: dependency-name
        patterns:
          - "go.opentelemetry.io/*"
      go-x-modules:
        group-by: dependency-name
        patterns:
          - "golang.org/x/*"
      go-other-modules:
        group-by: dependency-name
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/testcontainers/testcontainers-go*"
          - "go.opentelemetry.io/*"
          - "golang.org/x/*"
    ignore:
      # gofumpt 必须锁定在 pinned golangci-lint release 内 vendor 的版本
      # （golangci-lint v2.11.4 vendors gofumpt v0.9.2）。go.mod 的 gofumpt
      # 与 golangci-lint 内 vendor 的 gofumpt 版本一旦分裂，producer 侧
      # （tools/codegen 调用 gofumpt.Source）与 CI formatter gate
      # （golangci-lint 内 vendor 的同包）会对同一 diff 应用不同格式化规则
      # → CI 必红 / codegen drift。仅当同步升级 golangci-lint 时才解锁
      # （见 hack/lib/golangci-lint.sh 的 SYNC 契约）。PR #534 / #910 均因
      # 自动升级到 v0.10.0 被回滚。
      - dependency-name: "mvdan.cc/gofumpt"
