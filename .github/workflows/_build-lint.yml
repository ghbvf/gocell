name: Build / Lint / Test (reusable)

# Reusable workflow — called by ci.yml (push, full lint) and pr-check.yml
# (pull_request, merge-base diff lint).
# ref: grpc-go workflow separation (testing.yml + pr-validation.yml); this
# variant uses workflow_call to eliminate DRY duplication that grpc-go leaves
# in its two files.
on:
  workflow_call:
    inputs:
      lint-mode:
        description: '"full" runs golangci-lint with no filter (push baseline). "pr" uses --new-from-merge-base=origin/<base-ref> to suppress pre-existing noise on pull requests.'
        type: string
        required: true
      base-ref:
        description: 'For lint-mode=pr: the PR target branch name (e.g. "develop", "main"). Ignored when lint-mode=full.'
        type: string
        default: develop
      run-integration:
        description: 'When true, runs the integration-test job (testcontainers, ~10m). Default false.'
        type: boolean
        default: false
      run-sonar:
        description: 'When true, runs the sonarcloud job (needs both build-test + integration-test coverage). Default false. Requires secrets.SONAR_TOKEN. Must not be true when run-integration is false — sonarcloud needs both coverage profiles.'
        type: boolean
        default: false
      run-os-smoke:
        description: 'When true, runs the os-smoke matrix job on macOS and Windows to verify cross-platform unit behaviour. Default false.'
        type: boolean
        default: false
      run-examples-smoke:
        description: 'When true, runs the examples-smoke job that boots examples/ssobff as a subprocess and asserts /readyz within 5s. Default false. Runs in parallel with build-test and integration-test — does not extend wall-time.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # build-test is a matrix of 5 package shards run in parallel. Sharding splits
  # GoCell's package layout (kernel/tools/runtime/corecells/adapters+others) so each
  # shard's timing maps cleanly to an architectural boundary, making per-shard
  # cost easy to interpret. Static (tools/) and concurrency-sensitive
  # (kernel/runtime) shards account for the bulk of test time; isolating tools
  # cut the critical path from ~340s to ~170s.
  #
  # Race-detector responsibility lives in the dedicated test-race.yml workflow,
  # not here. build-test is purely build / lint / coverage. Swap to dynamic
  # sharding (consul-style `go list | shuf | split`) if shard timings diverge > 2x.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: kernel
            pkgs: ./kernel/...
            static_checks: true
          - shard: tools
            # archtest 16-shard matrix runs in .github/workflows/archtest-nightly.yml
            # (process-isolated, schedule-driven). Excluded here to avoid
            # duplicate execution + OOM in the PR-time tools shard. See
            # hack/verify-archtest.sh + ADR
            # 202605120000-adr-archtest-process-isolation.md §Amendment
            # 2026-05-23-pr-time-to-nightly. The remaining tools/ subpackages
            # (codegen / depgraph / generatedverify / metricschema / slowgate
            # / etc.) are discovered at runtime by the Test step via
            # `go list ./tools/...`; any new tools/<sub> package joins
            # coverage automatically with zero yml maintenance.
            pkgs: _dynamic_archtest_excluded
            static_checks: false
          - shard: runtime
            pkgs: ./runtime/... ./pkg/...
            static_checks: false
          - shard: cells
            pkgs: ./corecells/...
            static_checks: false
          # `others` was a single 140s shard covering adapters + cmd +
          # examples + tests + contracts. Splitting along compile cost:
          # `others-heavy` carries ./adapters/... (external SDK dependency
          # surface — postgres / redis / rabbitmq / vault / otel). `others-light`
          # carries the remaining lightweight subtrees. The split brings the
          # heavier leg below the kernel-shard critical path.
          #
          # examples/* unit tests are NO LONGER in this shard: each example is its
          # own go.work module (#1556), so a root `./examples/...` pattern would
          # stop at the nested-module boundary and silently match zero packages.
          # Per-module example unit tests run in hack/verify-workspace-test.sh
          # (make verify → governance.yml); per-module example build runs in
          # hack/verify-workspace.sh — both iterate the go.work module funnel.
          # Likewise cmd/gocell (#1557) and cmd/corebundle (#1559) are each their
          # own go.work module now: the `./cmd/...` pattern in the others-light
          # shard below stops at each nested-module boundary and matches only
          # cmd/internal. cmd/gocell + cmd/corebundle unit tests run in
          # hack/verify-workspace-test.sh and their builds in hack/verify-workspace.sh
          # — the same go.work funnel as examples/*.
          - shard: others-heavy
            pkgs: ./adapters/...
            static_checks: false
          - shard: others-light
            pkgs: ./cmd/... ./tests/... ./contracts/...
            static_checks: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history so `golangci-lint --new-from-merge-base=origin/<base-ref>`
          # can run `git merge-base` successfully. Only the kernel shard actually
          # runs golangci-lint, but fetch-depth: 0 is cheap at this repo size and
          # keeping it uniform avoids conditional checkout complexity.
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Static checks (Build, golangci-lint, kernel coverage gate) run only
      # on the kernel shard. Running them on every shard would cost 4x runner
      # minutes for no signal — each step is repo-global (no package scoping)
      # and its verdict does not depend on which shard is executing. Hosting
      # them on the kernel shard (the smallest test load at ~22k lines /
      # 17.9%) also gives the fastest fail-fast path when a lint regression
      # is introduced. (Vet is intentionally not listed: govet is in
      # golangci-lint v2's default linter set — see the absence-rationale
      # comment between Build and golangci-lint below.)
      - name: Build
        # `go build ./...` stops at nested-module boundaries: examples/* (#1556)
        # and cmd/gocell (#1557) are not compiled here. Their per-module
        # release-consistency build runs in hack/verify-workspace.sh (GOWORK=off);
        # cmd/gocell additionally compiles via `go run ./cmd/gocell verify generated`
        # in the verify-codegen job below.
        if: matrix.static_checks
        run: go build ./...

      # `go vet ./...` is intentionally absent here: golangci-lint v2 has
      # `govet` in its default-enabled linter set (see .golangci.yml line 4
      # comment), so a standalone vet step would re-walk the full repo AST
      # for zero additional signal. Nested go.work modules are linted in the
      # following satellite step through the same hack/lib/modules.sh funnel used
      # by build/test. Cross-tag vet (e.g. `-tags=e2e`) is still done explicitly
      # below where the build tag changes the file set.
      - name: golangci-lint
        if: matrix.static_checks
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          # SYNC: this version literal is the second copy of the single
          # source declared in hack/lib/golangci-lint.sh::GOLANGCI_LINT_VERSION.
          # Any drift means the CI lint shard and the local `make fmt` /
          # `hack/verify-gofumpt.sh` paths apply different formatter rules
          # to the same diff — defeating the gofumpt producer rollout.
          # Reviewer-enforced sync (no archtest because the upstream is yaml).
          version: v2.11.4
          # `verify: true` runs `golangci-lint config verify` before linting so a
          # broken `.golangci.yml` (v2 schema typo, unknown linter, malformed
          # exclusions) fails fast instead of silently degrading to v1 parsing
          # where new linters are ignored.
          verify: true
          # only-new-issues uses the GitHub pull-request diff API which
          # refuses diffs larger than 300 files; fall back to
          # --new-from-merge-base so mass-rename PRs (repo-wide renames,
          # metadata id sweeps) still get "new issue" filtering.
          # On push (lint-mode: full) no filter is applied — every issue is
          # surfaced so the develop branch stays clean as an absolute baseline.
          # On pr (lint-mode: pr) use origin/<base-ref> so PRs targeting main
          # or release/* lint against their actual merge-base, not develop.
          args: ${{ inputs.lint-mode == 'pr' && format('--new-from-merge-base=origin/{0}', inputs.base-ref) || '' }}

      - name: golangci-lint workspace satellites
        if: matrix.static_checks
        env:
          LINT_ARGS: ${{ inputs.lint-mode == 'pr' && format('--new-from-merge-base=origin/{0}', inputs.base-ref) || '' }}
        run: |
          set -euo pipefail
          source hack/lib/util.sh
          source hack/lib/modules.sh
          source hack/lib/golangci-lint.sh

          root="$PWD"
          lint_bin="$(gocell::golangci_lint::ensure)"
          module_dirs="$(gocell::modules::dirs)"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ "$dir" != "." ] || continue
            echo "+++ golangci-lint in module: $dir"
            (
              cd "$dir"
              # shellcheck disable=SC2086 # LINT_ARGS is intentionally split into CLI flags.
              "$lint_bin" run --config "$root/.golangci.yml" $LINT_ARGS ./...
            )
          done <<<"$module_dirs"

      # Build slowgate (G9 SLOW-TEST-BUDGET) — wall-clock budget gate that
      # consumes `go test -json` events and fails the shard when any
      # (Package, Test) Elapsed exceeds the threshold without an allowlist
      # entry. Mirrors the e2egate build pattern at the integration job. Any
      # PR that adds a slow test must either optimize it or add a justified
      # allowlist entry in tools/slowgate/allowlist.txt; SLOWGATE-ALLOWLIST-01
      # archtest enforces no-orphan + must-justify on the file itself.
      - name: Build slowgate
        run: go build -o "$RUNNER_TEMP/slowgate" ./tools/slowgate

      # Test step: per-shard coverage profile with covermode=atomic. Atomic is
      # harmless without -race and keeps a single mode across all shards so
      # sonarcloud's cat-merge does not hit mode-header conflicts.
      # -coverpkg=./... was previously used here but dropped: every major Go OSS
      # project (grpc-go, prometheus, consul, etcd, tidb, cockroachdb) tests
      # without it, and with per-shard package lists it would actively harm Sonar
      # (each shard would instrument every package but only test its own subset,
      # producing per-shard profiles with 0% on out-of-shard packages that
      # would dilute the merged view). Each shard now reports only what it tested.
      #
      # No -race here — Linux race-detector coverage lives in the dedicated
      # test-race.yml workflow (kernel/, runtime/, pkg/, typeseval cache).
      # Supplemental Apple Silicon race coverage is in the os-smoke job below
      # (macOS leg, continue-on-error) — separate ownership: linux-shard
      # owns the strict gate, os-smoke owns cross-platform smoke.
      #
      # `-json` redirects test framework events to stdout (test2json schema);
      # `-coverprofile` continues to write the coverage atomic file
      # independently. `tee` archives the raw event stream to RUNNER_TEMP
      # so that *non*-slowgate failures (test panics, build errors, sub-
      # test stack traces) remain diagnosable from the uploaded artifact —
      # without `tee`, slowgate consumes the event stream and only its own
      # threshold-summary survives in stderr, which is insufficient for
      # arbitrary test failures. The artifact upload below is conditional
      # on step failure (`if: failure()`) to keep the success-path
      # exposure surface and storage cost minimal.
      #
      # `set -o pipefail` is explicitly set here — GHA bash does NOT enable
      # it by default, and without it a non-zero `go test` exit code would
      # be masked by `tee`/`slowgate` success. Do not remove this line.
      #
      # `--threshold=20s` matches `defaultThreshold` in tools/slowgate/main.go;
      # the literal is duplicated to keep the workflow self-documenting at
      # the call site. Calibrated for GHA ubuntu-latest 2-CPU runners where
      # packages.Load-bound tests run 5–15× slower than developer laptops.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          PKGS='${{ matrix.pkgs }}'
          if [ "$PKGS" = "_dynamic_archtest_excluded" ]; then
            # tools shard runtime discovery: every ./tools/<sub> package
            # except archtest (which runs in archtest-nightly.yml — see
            # ADR 202605120000 §Amendment 2026-05-23-pr-time-to-nightly).
            # Using `go list` as the ground truth makes "new tools
            # subpackage not covered" violation unrepresentable.
            PKGS=$(go list ./tools/... | grep -v '^github.com/ghbvf/gocell/tools/archtest$' | tr '\n' ' ')
          fi
          go test \
            -covermode=atomic \
            -coverprofile=coverage-shard-${{ matrix.shard }}.out \
            -json \
            $PKGS \
            -count=1 -timeout 5m \
            | tee "$RUNNER_TEMP/test-${{ matrix.shard }}.json" \
            | "$RUNNER_TEMP/slowgate" --threshold=20s --allowlist=tools/slowgate/allowlist.txt

      # Upload the raw `go test -json` event stream only on Test step
      # failure. Restored as a P1 review fix: without it, a non-slowgate
      # failure (test panic, race report, build error) loses the full
      # event context because slowgate consumes the JSON stream and only
      # surfaces threshold-summary lines on stderr. retention 3 days is
      # the diagnostic window — past that, the failing CI run itself
      # already contains the GHA step log via 90-day step-log retention.
      - name: Upload test-json artifact (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-json-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-${{ matrix.shard }}.json
          retention-days: 3

      # Static governance gates (validate --strict, verify journey, check
      # contract-health, check unconditional-skip, examples internal-import
      # ban) are owned by the dedicated Governance Strict workflow
      # (.github/workflows/governance.yml → `make verify`). Running them
      # here would duplicate work and create two paths to update whenever a
      # gate is added. archtest layer/cell-internal guards are NOT covered
      # by this workflow at all on push / pull_request: per ADR
      # 202605120000 §D6 + §Amendment 2026-05-23-pr-time-to-nightly, the
      # sole CI archtest gate is .github/workflows/archtest-nightly.yml
      # (schedule cron + workflow_dispatch, 16-shard matrix). The tools
      # shard above runs only tools/archtest/internal/{scanner,typeseval,
      # rawparamfixture,wrapfixture} sub-package unit tests (lightweight,
      # do not accumulate *types.Info graph); the top-level archtest package
      # is excluded by the sentinel _dynamic_archtest_excluded (see the
      # build-test matrix tools entry). governance.yml's `make verify`
      # likewise sets VERIFY_SKIP=archtest to delegate to the nightly job.
      # Push / PR archtest has no local coverage either: hack/githooks/
      # pre-push deliberately omits archtest after PR #887 review round-2
      # (CPU/RSS budget — ~3min wall + 43 GB RSS violates the hook's sub-
      # 10s deterministic contract; see ADR §"pre-push archtest 撤回").
      # Developers who want PR-time archtest feedback run `make verify`
      # or `bash hack/verify-archtest.sh` explicitly.

      # Compile-verify e2e package even when integration-test job is skipped.
      # The e2e build tag gates runtime behaviour; this step ensures type/import
      # correctness is always checked on the kernel shard (static_checks gate).
      - name: Vet e2e package (compile verification)
        if: matrix.static_checks
        run: go vet -tags=e2e ./tests/e2e/...

      # Kernel coverage gate — parses the per-shard coverage profile produced
      # by the Test step (covermode=atomic, one statement-block per row) and
      # computes statement-weighted per-package coverage. Mirrors the
      # adapters/postgres coverage gate pattern below: no extra `go test`
      # invocation, ~1s parse vs ~13s re-run. Atomic profile rows are
      # `<import_path>/<file>.go:start.col,end.col stmts hits`, so import
      # path is a clean per-package key — no need for `go test -cover` stdout.
      #
      # Equivalence with `go test -cover` stdout: `go test -cover` reports
      # "X% of statements" per package = (covered_stmts / total_stmts) * 100,
      # where a statement is "covered" iff its hit count is non-zero. Under
      # `-covermode=atomic`, the hits column ($3) is an atomic accumulator
      # of execution counts (≥0), so `if ($3 > 0)` is exactly the same
      # binary "covered or not" judgment — the per-package percentages
      # produced here match the legacy `go test -cover` stdout to the digit.
      #
      # Helper-package exemption: packages whose final path segment ends in
      # `test` (Go *test convention: authtest, celltest, commandtest,
      # outboxtest, persistencetest, sagajournaltest, sagaregtest) carry
      # fixtures / Must* wrappers, not production logic — exempt from the
      # 90% floor. Regex `[a-z0-9_]+test$` covers future helper names with
      # digits or underscores (e.g. `saga2test`); pure-lowercase is too
      # tight a contract to enforce only here. `[no statements]` packages
      # don't appear in the profile at all, so they're naturally skipped.
      #
      # FAIL aggregation: the inner awk always exits 0 (printing either
      # PASS or FAIL line); the outer grep scans the captured string to
      # update `fail`. Using `awk ... exit 1` for FAIL would interact with
      # `set -e` on the `result=$(...)` assignment, terminating the loop
      # on the first failing package before printing the FAIL line — the
      # gate would still go red, but the operator would lose visibility
      # into *every* failing package's percentage on the same run.
      - name: Kernel coverage gate
        if: matrix.static_checks
        run: |
          set -euo pipefail
          PROFILE="coverage-shard-${{ matrix.shard }}.out"
          KERNEL_PREFIX='github.com/ghbvf/gocell/kernel/'

          if [ ! -s "$PROFILE" ]; then
            echo "FAIL: $PROFILE missing or empty"; exit 1
          fi

          fail=0
          while IFS= read -r pkg; do
            if echo "$pkg" | grep -qE '/[a-z0-9_]+test$'; then
              continue
            fi
            pkg_pct=$(awk -v prefix="${pkg}/" '
              $1 ~ "^"prefix"[^/]+\\.go:" {
                total += $2
                if ($3 > 0) hit += $2
              }
              END {
                if (total > 0) printf "%.1f", hit/total*100
                else print "no_stmts"
              }
            ' "$PROFILE")
            if [ "$pkg_pct" = "no_stmts" ]; then
              continue
            fi
            result=$(awk -v p="$pkg_pct" -v pkg="$pkg" 'BEGIN {
              if (p+0 < 90) { print "FAIL: " pkg " coverage " p "% < 90%" }
              else { print "PASS: " pkg " " p "%" }
            }')
            echo "$result"
            if echo "$result" | grep -q '^FAIL'; then
              fail=1
            fi
          done < <(awk -v prefix="$KERNEL_PREFIX" '
            $1 ~ "^"prefix {
              path = $1
              sub(/:[^:]*$/, "", path)
              sub(/\/[^\/]+\.go$/, "", path)
              print path
            }
          ' "$PROFILE" | sort -u)

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "PASS: all kernel packages >= 90%"

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.out
          retention-days: 1

  # archtest 16-shard matrix moved to .github/workflows/archtest-nightly.yml
  # (schedule-driven + workflow_dispatch). There is NO PR-time local
  # fast-feedback replacement: hack/githooks/pre-push deliberately omits
  # archtest after PR #887 review round-2 (CPU/RSS budget violates the
  # hook's sub-10s deterministic contract — see ADR §"pre-push archtest
  # 撤回"). Developers who want PR-time archtest feedback run `make verify`
  # or `bash hack/verify-archtest.sh` explicitly. Rationale for the PR-time
  # matrix removal: brittleness (modulo-shift SLOW, tagGroup OOM templates,
  # GHA runner spot preempt amplified 16×) outweighed value; nightly
  # catches true invariant violations within 24h, surfacing via GHA default
  # email-to-watchers + Actions UI red ✗ + workflow_dispatch rerun. (An
  # alert-on-failure job auto-opening a P0 issue was tried in PR #887
  # round-1 and dropped in review round-2 for fragile `issues: write`
  # surface — see ADR §"alert-on-failure 撤回".) See ADR 202605120000
  # §Amendment 2026-05-23-pr-time-to-nightly.

  integration-test:
    if: ${{ inputs.run-integration }}
    runs-on: ubuntu-latest
    # No `needs: build-test` — integration-test is independent (its own
    # checkout + go build inside `go test`). Running in parallel with
    # build-test cuts ~2 min of wall time. Cost: a CI minute wasted on
    # integration when unit tests break, which at current PR frequency is
    # a worthwhile trade.
    #
    # testcontainers manages containers dynamically (no static services)
    # to avoid port conflicts with host-bound services.
    #
    # Matrix sharding (4 leaves) splits the discovered integration package
    # set by import-path prefix so that 22 packages do not run serially on a
    # single runner. Each shard runs the same discovery step (`go list
    # -tags=integration`) then filters via the shard's import-path regex —
    # the set-of-truth remains the build-tag-derived list (CI-INTEGRATION-
    # DISCOVERY-01 archtest still passes; no hardcoded `./<path>/...` globs
    # appear in the run block).
    #
    # Step scoping uses three flags on matrix entries (all booleans, no
    # string sentinels — YAML null vs '' parsing differs across runners
    # and is too easy to misread). Default each new shard to false explicitly:
    #   - `run_main_integration`: enables the main `Integration tests
    #     (testcontainers)` step + the coverage profile upload. Set false
    #     on the adapters-race leg, which runs only focused race/-run
    #     steps and produces no profile.
    #   - `run_adapters_extras`: scopes Redis cluster compile gate +
    #     adapters/postgres coverage gate to the `adapters` main leg
    #     (which produces coverage-integration-adapters.out the gate reads).
    #   - `run_adapters_race`: scopes the three race / OTel smoke steps
    #     to the dedicated `adapters-race` leg. Splitting them off keeps
    #     the adapters main leg's wall-time bounded by the main integration
    #     step alone (~117s) instead of main + ~70s of serial race steps.
    #
    # `filter` is still per-shard (passed via env to the discovery shell);
    # it's an integration-test routing axis, not a step-enable toggle.
    #
    # New integration test contributors: your package falls into a shard
    # automatically by import-path prefix — no yaml edit needed:
    #   adapters/...                          → adapters shard
    #   corecells/...                             → cells shard
    #   cmd/... or examples/...               → corebundle shard
    #   tests/... or kernel/... or runtime/.. → tests shard
    # archtest CI-INTEGRATION-DISCOVERY-01 still gates that every
    # //go:build integration file is discovered by `go list -tags=integration`.
    strategy:
      fail-fast: false
      matrix:
        include:
          # adapters main leg: full adapter integration suite + Redis cluster
          # compile gate + adapters/postgres coverage gate. Each adapters-only
          # post-integration step MUST carry `if: ${{ matrix.run_adapters_extras }}`.
          - shard: adapters
            filter: '^github.com/ghbvf/gocell/adapters/'
            run_main_integration: true
            run_adapters_extras: true
            run_adapters_race: false
          # adapters-race leg: OTel smoke + PG migrator race + Redis primitive
          # race only. `run_main_integration: false` disables the main
          # integration step + coverage upload. Race steps re-spin small
          # containers focused on -run patterns; no coverage profile is
          # produced.
          - shard: adapters-race
            filter: ''
            run_main_integration: false
            run_adapters_extras: false
            run_adapters_race: true
          - shard: cells
            filter: '^github.com/ghbvf/gocell/corecells/'
            run_main_integration: true
            run_adapters_extras: false
            run_adapters_race: false
          - shard: corebundle
            filter: '^github.com/ghbvf/gocell/(cmd|examples)/'
            run_main_integration: true
            run_adapters_extras: false
            run_adapters_race: false
          - shard: tests
            filter: '^github.com/ghbvf/gocell/(tests|kernel|runtime|tools)/'
            run_main_integration: true
            run_adapters_extras: false
            run_adapters_race: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Build slowgate (G9 SLOW-TEST-BUDGET) for the integration job — the
      # same wall-clock budget gate the build-test job uses, here applied to
      # the testcontainer integration suite. The integration tier uses a
      # higher --threshold (120s) than build-test's 20s because container
      # round-trips (broker restart / reconnect — e.g. adapters/mqtt
      # TestIntegration_PublisherTrueReconnect ~60s) are legitimately slower
      # than unit tests. 120s is a CONSERVATIVE INITIAL ceiling: ~2x the
      # known-slowest integration test plus headroom for GHA container
      # start/stop overhead that local dev (no Docker) cannot measure — it
      # errs toward not red-lighting an unrelated PR on first run. Tighten it
      # once real CI timings are observed. A test that exceeds 120s must be
      # optimized or take a justified tools/slowgate/allowlist.txt entry
      # (SLOWGATE-ALLOWLIST-01 must-justify; its packages.Load uses
      # FlatNonDefaultTags, so integration-tagged entries resolve). #1430
      # wires this so the AC-12 ≤60s budget is machine-gated rather than an
      # unenforced prose note.
      - name: Build slowgate (integration)
        if: ${{ matrix.run_main_integration }}
        run: go build -o "$RUNNER_TEMP/slowgate" ./tools/slowgate

      - name: Integration tests (testcontainers)
        # Skipped on adapters-race leg (run_main_integration: false); that
        # leg only runs the focused race/OTel steps below, not the full
        # adapter integration suite.
        if: ${{ matrix.run_main_integration }}
        env:
          GOCELL_TEST_DOCKER_REQUIRED: "1"
          SHARD_NAME: ${{ matrix.shard }}
          SHARD_FILTER: ${{ matrix.filter }}
        # Auto-discover packages by build tag rather than maintaining a
        # hardcoded list. Each prior addition to the explicit list (examples/
        # ssobff, runtime/bootstrap, corecells/accesscore/slices/identitymanage,
        # tests/testutil) was a documented incident where new integration
        # tests silently never ran in CI because nobody updated this step.
        # archtest CI-INTEGRATION-DISCOVERY-01 prevents regression to a
        # hardcoded list.
        #
        # Discovery: set-diff (comm -13) between the bare `go list` and
        # `go list -tags=integration` outputs. A package appears in the diff
        # iff enabling the tag changed its TestGoFiles / XTestGoFiles set —
        # i.e., the package has at least one //go:build integration file.
        # This precisely matches the integration coverage surface and avoids
        # the over-broad `./...` (which would re-run every unit test under
        # integration tags) and the under-broad single-tag listing (which
        # lists all test-bearing packages, integration or not).
        # comm requires sorted input (both files are sorted) and returns
        # exit 0 even when files differ — unlike `diff`, which returns 1 on
        # differences and would abort under `set -e -o pipefail`.
        #
        # Carve-outs (intentionally excluded):
        #   - Compound-tag packages (`integration && otelcollector`,
        #     `integration_cluster`) — covered by dedicated OTel smoke / vet
        #     steps below; their constraints evaluate false under
        #     {integration} alone.
        #   - `e2e`-tagged files (tests/e2e/...) — owned by the dedicated
        #     `e2e` job which runs the docker-compose harness. Pure-helper
        #     unit tests under tests/e2e/internal/clients also run there.
        #   - `examples_smoke` — covered by the dedicated examples-smoke job.
        #
        # Empty-set guard fails fast if discovery returns nothing —
        # build-context misconfiguration could otherwise silently zero out
        # the integration job into a no-op pass.
        #
        # -coverpkg remains omitted to match per-shard unit test profile
        # semantics; each run reports coverage only for tested packages.
        #
        # ref: kubernetes/kubernetes hack/make-rules/test-integration.sh
        # (kube::test::find_integration_test_pkgs uses go list -find for discovery)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # Module-aware discovery (#1556): examples/* are their own go.work
          # modules, so a root `go list ./...` stops at the nested-module boundary
          # and would SILENTLY DROP every example integration test. Enumerate every
          # workspace member from the SAME go.work funnel the build/test gates use
          # (hack/lib/modules.sh → `go work edit -json`) and run the bare-vs-tagged
          # comm diff per module — a module added to go.work is covered with zero
          # hardcoded list. CI-INTEGRATION-DISCOVERY-01 asserts this step sources
          # that funnel (gocell::modules::dirs), so dropping it is a red archtest.
          #
          # Include .GoFiles alongside .TestGoFiles / .XTestGoFiles so that
          # packages whose non-test //go:build integration files (e.g.,
          # tests/testutil/rabbitmq_integration.go) gain visibility under the
          # tag are also detected — defending against the comm -13 false-
          # identity case where TestGoFiles alone happens to be unchanged.
          source hack/lib/util.sh
          source hack/lib/modules.sh
          list_fmt='{{.ImportPath}}|{{join .GoFiles ","}}|{{join .TestGoFiles ","}}|{{join .XTestGoFiles ","}}'
          # Command substitution (NOT `while read < <(...)`) so a go.work path-
          # validation failure in the funnel propagates under `set -e`.
          module_dirs_raw="$(gocell::modules::dirs)"
          : >"$tmp/bare.txt"
          : >"$tmp/tagged.txt"
          while IFS= read -r moddir; do
            [ -n "$moddir" ] || continue
            go -C "$moddir" list -find -f "$list_fmt" ./... >>"$tmp/bare.txt"
            go -C "$moddir" list -tags=integration -find -f "$list_fmt" ./... >>"$tmp/tagged.txt"
          done <<<"$module_dirs_raw"
          sort -o "$tmp/bare.txt" "$tmp/bare.txt"
          sort -o "$tmp/tagged.txt" "$tmp/tagged.txt"
          # Shard filter applies to the discovered import-path list — keeps
          # discovery as the build-tag-derived ground truth (CI-INTEGRATION-
          # DISCOVERY-01) and avoids hardcoded `./<path>/...` globs in the
          # `go test` invocation. Empty-set fail-fast fires per shard so a
          # mis-typed filter doesn't pass silently.
          mapfile -t pkgs < <(comm -13 "$tmp/bare.txt" "$tmp/tagged.txt" | awk -F'|' '{print $1}' | grep -E "$SHARD_FILTER" | sort -u)
          test "${#pkgs[@]}" -gt 0 || { echo "FAIL: no integration packages discovered for shard '$SHARD_NAME' (filter='$SHARD_FILTER'); either filter regex is wrong or the package set under that prefix vanished" >&2; exit 1; }
          printf 'Shard %s integration packages (%d):\n' "$SHARD_NAME" "${#pkgs[@]}"
          printf '  %s\n' "${pkgs[@]}"
          # `-json` emits the test2json event stream to stdout; slowgate
          # consumes it and fails the shard on any (Package, Test) Elapsed
          # over --threshold without an allowlist entry. `tee` archives the
          # raw stream to RUNNER_TEMP so non-slowgate failures (panics,
          # container errors) stay diagnosable. `set -euo pipefail` (set at
          # the top of this run block) makes a go-test OR slowgate non-zero
          # exit fail the step. `-coverprofile` still writes the atomic
          # profile independently. #1430.
          # `go test … "${pkgs[@]}" … -timeout 15m` is kept on one physical
          # line — CI-INTEGRATION-DISCOVERY-01 matches `go test … "${pkgs[@]}"`
          # within a single line; only the pipe stages continue below.
          go test -tags=integration -covermode=atomic -coverprofile=coverage-integration-${{ matrix.shard }}.out -json "${pkgs[@]}" -count=1 -timeout 15m \
            | tee "$RUNNER_TEMP/integration-${{ matrix.shard }}.json" \
            | "$RUNNER_TEMP/slowgate" --threshold=120s --allowlist=tools/slowgate/allowlist.txt

      # Upload the raw `go test -json` event stream only on Integration step
      # failure. With `-json`, the GHA step log shows slowgate's threshold
      # summary on stderr, not human-readable test output — a non-slowgate
      # failure (panic, container error) is only fully diagnosable from this
      # archived stream. Mirrors the build-test job's test-json artifact.
      - name: Upload integration test-json artifact (failure only)
        if: ${{ failure() && matrix.run_main_integration }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-json-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-${{ matrix.shard }}.json
          retention-days: 3

      - name: OTel collector smoke
        if: ${{ matrix.run_adapters_race }}
        env:
          GOCELL_TEST_DOCKER_REQUIRED: "1"
        # Keep the PR/push gate focused on the single real OTLP/gRPC collector
        # round-trip. The nightly/manual workflow still runs the full package
        # under the same tags as a compatibility patrol.
        # `no tests to run` guard: a focused `-run '^Foo$'` selector that
        # matches zero tests (test renamed / moved / deleted) emits a
        # "no tests to run" warning but still exits 0 — the gate would
        # silently pass. Pipe stdout+stderr through grep and fail explicitly.
        run: |
          set -euo pipefail
          out=$(go test -tags=integration,otelcollector ./adapters/otel/ \
            -run '^TestNewTracer_ExportsSpanToOTLPCollector$' -count=1 -timeout 10m 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'no tests to run'; then
            echo "FAIL: -run selector matched zero tests in ./adapters/otel/; rename/move regression?"
            exit 1
          fi

      - name: Race coverage for PG migrator concurrent Up
        if: ${{ matrix.run_adapters_race }}
        env:
          GOCELL_TEST_DOCKER_REQUIRED: "1"
        # B4 GOOSE-SESSION-LOCKER regression guard. The main integration step
        # above runs without -race (15-min budget covers the full adapter
        # suite); test-race.yml's Linux race gate is scoped to
        # kernel/runtime/pkg and does not pull the integration build tag,
        # so without this dedicated step `TestMigrator_ConcurrentUp_NoRaceWithSessionLocker`
        # would never exercise the Go race detector in CI. -count=3 amplifies
        # any timing-dependent race; the focused -run keeps wall-time ≤ 60s
        # by skipping every other postgres integration test.
        #
        # `no tests to run` guard (same rationale as the OTel step above):
        # `-run` selectors that match zero tests still exit 0; the grep
        # converts that into an explicit FAIL so renames/moves don't
        # silently disable the race regression防线.
        run: |
          set -euo pipefail
          out=$(go test -tags=integration -race -count=3 -timeout 5m ./adapters/postgres/ \
            -run '^TestMigrator_ConcurrentUp_NoRaceWithSessionLocker$' 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'no tests to run'; then
            echo "FAIL: -run selector matched zero tests in ./adapters/postgres/; rename/move regression?"
            exit 1
          fi

      - name: Race coverage for Redis primitive contention
        if: ${{ matrix.run_adapters_race }}
        env:
          GOCELL_TEST_DOCKER_REQUIRED: "1"
        # B11 PR-V1-REDIS-KEYNS / B2-A-29: race stress for the four Redis
        # primitives (DistLock, IdempotencyClaimer, NonceStore, Cache).
        # Same rationale as the PG migrator race step above — the main
        # integration step does not enable -race, and test-race.yml's
        # Linux race gate is scoped to kernel/runtime/pkg without the
        # integration build tag. -count=3 amplifies timing-dependent races
        # in the dual-KEY Lua scripts and SET NX semantics; the focused
        # -run pattern keeps wall-time ≤ 90s by exercising only the
        # TestRaceStress_* family.
        #
        # `no tests to run` guard (same rationale as the OTel and PG steps
        # above): `-run` selectors that match zero tests still exit 0; the
        # grep converts that into an explicit FAIL so renames/moves don't
        # silently disable the race regression 防线.
        run: |
          set -euo pipefail
          out=$(go test -tags=integration -race -count=3 -timeout 5m ./adapters/redis/ \
            -run '^TestRaceStress_' 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'no tests to run'; then
            echo "FAIL: -run selector matched zero tests in ./adapters/redis/; rename/move regression?"
            exit 1
          fi

      - name: Redis cluster compile gate
        if: ${{ matrix.run_adapters_extras }}
        # B10 PR-V1-REDIS-CLUSTER: cluster_real_test.go is gated by
        # //go:build integration_cluster and is env-driven (skips when
        # GOCELL_TEST_REDIS_CLUSTER_ADDRS is unset). A live 6-node cluster
        # is not stood up in CI — host-network gossip topology does not
        # virtualize cleanly on Actions runners — but compiling under the
        # cluster tag keeps the file from bit-rotting when go-redis API
        # changes or our own cluster paths drift. Real-cluster integration
        # is left to staging and B11 backlog.
        run: go vet -tags=integration_cluster ./adapters/redis/...

      # adapters/postgres coverage gate (G11 / PR-V1-TEST-GATE-CLOSURE)
      # Closes P3-TD-02 + P4-TD-08 + P4-TD-11: previously coverage-integration.out
      # was only collected for SonarCloud (no enforcement) and Migrator.Down
      # v=0 idempotency had no regression test. Mirrors the kernel coverage
      # gate at this file:169-192 — same exit-1 + PASS-log shape.
      #
      # Package floor 80% (P3-TD-02 original requirement, one-shot — not the
      # phased 60% step). Per-file floor 70% on pool.go / tx_manager.go /
      # migrator.go guards P3-TD-02's stated root concern ("Pool/TxManager/
      # Migrator 真实路径未覆盖") so the package average can't be propped up
      # by high outbox/refresh coverage while the core trio sags.
      # pool_statter.go (66.7%) is intentionally outside the per-file floor —
      # it's a pure delegating Stats() adapter; P3-TD-02 wording scopes the
      # root concern to the Pool/TxManager/Migrator trio. Package floor 80%
      # already accounts for its drag on the average.
      #
      # Coverage is parsed straight from coverage-integration.out — no extra
      # test run, no testcontainers re-spin. The profile rows (one per
      # statement-block) are statement-weighted aggregated by awk so a 1-stmt
      # uncovered helper can't drag a 100-stmt covered hot path down.
      - name: adapters/postgres coverage gate
        if: ${{ matrix.run_adapters_extras }}
        run: |
          set -euo pipefail
          PROFILE=coverage-integration-${{ matrix.shard }}.out
          PKG_PREFIX='github.com/ghbvf/gocell/adapters/postgres/'

          if [ ! -s "$PROFILE" ]; then
            echo "FAIL: $PROFILE missing or empty"; exit 1
          fi

          # awk emits a single "%.1f" string for both the success and the
          # zero-rows branches. Empty strings bubble up as a separate guard
          # below; numeric "<threshold" comparison ($p+0) covers the 0.0 case.
          # Package-level %: statement-weighted over all adapters/postgres files.
          pkg_pct=$(awk -v prefix="$PKG_PREFIX" '
            $1 ~ "^"prefix"[^/]+\\.go:" {
              total += $2
              if ($3 > 0) hit += $2
            }
            END {
              if (total > 0) printf "%.1f", hit/total*100
              else printf "0.0"
            }
          ' "$PROFILE")
          if [ -z "$pkg_pct" ]; then
            echo "FAIL: awk produced no output for $PROFILE"; exit 1
          fi
          awk -v p="$pkg_pct" 'BEGIN {
            if (p+0 < 80) { print "FAIL: adapters/postgres coverage " p "% < 80%"; exit 1 }
            print "PASS: adapters/postgres coverage " p "% >= 80%"
          }'

          # Per-file floor: P3-TD-02 root concern guard.
          for f in pool.go tx_manager.go migrator.go; do
            file_pct=$(awk -v file="$PKG_PREFIX$f:" '
              index($1, file) == 1 {
                total += $2
                if ($3 > 0) hit += $2
              }
              END {
                if (total > 0) printf "%.1f", hit/total*100
                else printf "0.0"
              }
            ' "$PROFILE")
            if [ -z "$file_pct" ]; then
              echo "FAIL: awk produced no output for adapters/postgres/$f"; exit 1
            fi
            awk -v p="$file_pct" -v f="$f" 'BEGIN {
              if (p+0 < 70) { print "FAIL: adapters/postgres/" f " coverage " p "% < 70%"; exit 1 }
              print "PASS: adapters/postgres/" f " coverage " p "% >= 70%"
            }'
          done

      - name: Upload integration coverage profile
        # adapters-race leg has no main integration step, so no profile is
        # produced — skip upload to keep upload-artifact from failing on a
        # missing path. Same flag as the main integration step.
        if: ${{ matrix.run_main_integration }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: coverage-integration-${{ matrix.shard }}.out
          retention-days: 3

  e2e:
    # PR-CFG-G1: real-execution gate for tests/e2e. Runs corebundle in a
    # 4-service docker-compose harness (postgres + redis + migrate + corebundle)
    # in real adapter + postgres cell mode, then pipes `go test -json` through
    # tools/e2egate. Fails the job when zero tests executed or any package
    # declared tests but had them all skipped.
    #
    # PR-CFG-G1 promotion from PR-CFG-J: harness now uses a real PG backend
    # (GOCELL_CELL_ADAPTER_MODE=postgres). accesscore and auditcore are wired
    # with real outbox writers via the shared PG pool (commits 1-3), so
    # DurabilityDurable mode works end-to-end and the 4 ConfigEncryption tests
    # are unskipped via GOCELL_E2E_PG_AVAILABLE=1.
    #
    # Independent of integration-test on purpose: testcontainers and
    # docker-compose are different infra strategies, and a failure in
    # either should not blame the other.
    if: ${{ inputs.run-integration }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # E2E_PG_PASSWORD is injected here (not committed in docker-compose.e2e.yaml
    # which uses ${E2E_PG_PASSWORD:?...} with no software fallback). Sonar's
    # Vulnerability blocker on hardcoded credentials is satisfied by externalizing
    # the value to this CI job env. Local devs use tests/e2e/.env.e2e.example.
    env:
      E2E_PG_PASSWORD: gocell-e2e-ci-pwd
      GOCELL_APP_PASSWORD: gocell-app-restricted-pw-ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build e2egate
        run: go build -o "$RUNNER_TEMP/e2egate" ./tools/e2egate/cmd/e2egate
      - name: Start dependencies (postgres + redis)
        working-directory: tests/e2e
        run: docker compose -f docker-compose.e2e.yaml up -d --wait postgres redis
      - name: Run migrations to completion
        working-directory: tests/e2e
        # `up --wait` errors on one-shot services because they exit instead of
        # becoming healthy. Run migrate foreground via --exit-code-from so the
        # step status mirrors the migrator's exit code (0 ok, !=0 fails).
        run: docker compose -f docker-compose.e2e.yaml up --exit-code-from migrate migrate
      - name: Start corebundle
        working-directory: tests/e2e
        run: docker compose -f docker-compose.e2e.yaml up -d --wait corebundle
      - name: Bootstrap admin token
        run: |
          set -o pipefail
          bash tests/e2e/scripts/bootstrap-admin.sh >> "$GITHUB_ENV"
      - name: Run e2e tests with execution gate
        env:
          GOCELL_E2E_DOCKER_AVAILABLE: "1"
          # Real-PG harness: unskips the 4 TestE2E_ConfigEncryption_* tests
          # that require a live PG backend (guarded by e2erequire.PG).
          GOCELL_E2E_PG_AVAILABLE: "1"
          GOCELL_E2E_RMQ_AVAILABLE: "0"
        # No -coverprofile here: Go's coverage instruments only the test
        # process, but the SUT (corebundle) runs as a separate container
        # process — Go can't observe it. The integration-test job already
        # covers ./tests/e2e/... + corebundle code paths under -tags=
        # integration,e2e via testcontainers; adding a profile here would
        # only re-record the HTTP client lines and dilute Sonar's view.
        run: |
          set -o pipefail
          go test -tags=e2e -json -count=1 -timeout=120s ./tests/e2e/... \
            | tee "$RUNNER_TEMP/e2e.json" \
            | "$RUNNER_TEMP/e2egate"
      - name: Capture compose logs
        if: always()
        working-directory: tests/e2e
        run: |
          docker compose -f docker-compose.e2e.yaml logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
          docker compose -f docker-compose.e2e.yaml logs migrate --no-color >> "$RUNNER_TEMP/compose.log" 2>&1 || true
      - name: Teardown
        if: always()
        working-directory: tests/e2e
        run: docker compose -f docker-compose.e2e.yaml down -v
      - name: Upload e2e diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            ${{ runner.temp }}/e2e.json
            ${{ runner.temp }}/compose.log
          retention-days: 7

  os-smoke:
    if: ${{ inputs.run-os-smoke }}
    # Advisory status: job failure does NOT fail the overall workflow.
    # Rationale: the Windows/macOS unit subset is an OS-interop smoke check
    # whose failures have historically been runner-image-specific flakes
    # (SDDL alias emission, UTF-16 wrapper drift, freed-SID memory reuse) —
    # three distinct Windows-only fixes landed in the same day on this file
    # alone. Keeping the job as required would keep blocking unrelated PRs
    # on runner abstraction leaks. This mirrors the Go project's policy of
    # linux/amd64-as-hard-gate with windows/macos builders as advisory.
    # Failures remain visible on the PR checks UI; regressions are expected
    # to be investigated, not merged over silently.
    continue-on-error: true
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet (cross-platform unit subset)
        run: go vet ./runtime/shutdown/... ./runtime/config/... ./kernel/governance/... ./pkg/pathsafe/...
        shell: bash

      - name: Cross-platform unit smoke
        # Note: -race requires CGO; available on macOS but not on bare windows-latest.
        # Enable -race on macOS to maximise race-detector coverage.
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            go test -race -count=1 -timeout 5m ./runtime/shutdown/... ./runtime/config/... ./kernel/governance/... ./pkg/pathsafe/...
          else
            go test -count=1 -timeout 5m ./runtime/shutdown/... ./runtime/config/... ./kernel/governance/... ./pkg/pathsafe/...
          fi
        shell: bash

  examples-smoke:
    # Boots examples/ssobff as a subprocess and asserts /readyz within 5s,
    # then triggers SIGTERM and verifies graceful shutdown. Regression guard
    # for the demo composition root (option wiring + lifecycle hook discovery
    # + dual-listener bind order) — walkthrough_test.go drives the cell chain
    # via httptest.NewServer and does NOT exercise main.go's bootstrap path.
    #
    # Parallel with build-test and integration-test — no `needs:` dependency.
    # The job (go build + testcontainers postgres spin + ~5s ready probe + ~1s
    # graceful shutdown) lands ~1–1.5 min, still well within the PR fan-out.
    # The smoke test self-provisions postgres via testcontainers (see
    # examples/ssobff/pgfixture_test.go), so this job depends on the runner's
    # Docker (ubuntu-latest has it built in) — no static `services:` block or
    # DATABASE_URL env is needed.
    if: ${{ inputs.run-examples-smoke }}
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: 0 — this job does not run golangci-lint, so the
      # default shallow checkout is sufficient and faster. (build-test sets
      # fetch-depth: 0 only because golangci-lint --new-from-merge-base
      # needs `git merge-base`.)
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: ssobff startup smoke
        # GOCELL_TEST_DOCKER_REQUIRED=1 makes RequireDocker fail (not skip) when
        # the runner has no Docker, so this guard cannot silently pass as a SKIP
        # — same fail-closed lever the integration-test job uses.
        env:
          GOCELL_TEST_DOCKER_REQUIRED: "1"
        # `examples_smoke` build tag isolates this from the `integration` tag
        # (whose tests assume DB/RMQ testcontainers and run in the slow
        # integration-test job). The dedicated tag also keeps `go test ./...`
        # without tags fast on developer laptops — subprocess smoke fires
        # only when explicitly requested.
        #
        # `-timeout 180s` bounds the test runtime once compilation finishes
        # (Go's `go test -timeout` does not constrain the build phase). Test
        # budget now includes a testcontainers postgres spin (image pull +
        # start) on top of the ~5s readyz poll + ~5s SIGTERM wait; 180s leaves
        # headroom for a cold image cache on shared runners. `-count=1` is
        # mandatory: without it `go test` may return a cached PASS from a prior
        # run with the same flags, silently skipping the subprocess that the
        # regression guard exists to exercise.
        # `-C examples/ssobff`: ssobff is its own go.work module (#1556), so a
        # root `./examples/ssobff/...` pattern would match zero packages. Run from
        # inside the module instead (workspace mode resolves core via go.work).
        run: go test -C examples/ssobff -tags=examples_smoke -count=1 -timeout 180s -run TestSSOBFFStartupSmoke ./...

  # Fork-PR guard: fork PRs cannot access org secrets (secrets.SONAR_TOKEN is
  # empty for forks), which would cause this job to fail with an opaque auth
  # error and block the PR with a red check. Guard: skip sonar when the PR head
  # repo differs from the base repo (i.e. fork PR). Fork PRs still receive full
  # build-test + integration-test coverage; they just lack SonarCloud
  # decoration/quality gate, which is acceptable — the quality gate fires again
  # post-merge on the push:develop run where the token is always available.
  sonarcloud:
    if: ${{ inputs.run-sonar && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: [build-test, integration-test]
    # Depends on both build-test (unit coverage) and integration-test
    # (integration coverage) so SonarCloud receives the merged profile.
    # This ensures new code in DB-path branches (schema_guard, outbox_relay)
    # counts toward the coverage gate.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Downloads all per-shard unit coverage artifacts into the workspace
      # root (merge-multiple: true flattens shard-keyed directories). Each
      # artifact contains exactly one file `coverage-shard-<shard>.out`; names
      # do not collide because each shard's output path is unique.
      - name: Download unit coverage profiles (all shards)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Download integration coverage profiles (all shards)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-integration-*
          merge-multiple: true

      - name: Merge coverage profiles
        # All profiles use `-covermode=atomic` so the single header emitted
        # here is compatible with every shard + integration data block. We
        # strip every input file's first line (`mode: ...`) and prepend one
        # header. The list is deterministic (every shard name in the build-
        # test matrix + every shard name in the integration-test matrix is
        # enumerated) so partial glob expansion cannot silently drop a
        # shard.
        #
        # SYNC-WITH-MATRIX: this file list must match the build-test +
        # integration-test matrix `shard` values one-to-one (excluding any
        # shard whose `run_main_integration: false`, which intentionally
        # produces no profile — currently only adapters-race). When adding,
        # renaming, or splitting a matrix shard, update this list in the
        # same PR or sonarcloud will silently drop the missing shard's
        # coverage signal.
        run: |
          set -euo pipefail
          echo "mode: atomic" > coverage-merged.out
          # build-test profiles: kernel, tools, runtime, cells, others-heavy,
          #   others-light (others-* replaces the single former `others`
          #   shard, see build-test matrix above).
          # integration-test profiles: adapters (main leg), cells, corebundle,
          #   tests. adapters-race has no profile (run_main_integration: false).
          for f in coverage-shard-kernel.out coverage-shard-tools.out coverage-shard-runtime.out coverage-shard-cells.out \
                   coverage-shard-others-heavy.out coverage-shard-others-light.out \
                   coverage-integration-adapters.out coverage-integration-cells.out coverage-integration-corebundle.out coverage-integration-tests.out; do
            if [ ! -f "$f" ]; then
              echo "FAIL: expected profile $f is missing" >&2
              exit 1
            fi
            tail -n +2 "$f" >> coverage-merged.out
          done
          echo "merged profile has $(wc -l < coverage-merged.out) lines from $(ls coverage-shard-*.out coverage-integration-*.out | wc -l) source profiles"

      - name: Cache SonarQube packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key // SHA-pinned action commit, not an API key
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

  # verify-codegen runs all three codegen drift gates independently of
  # build-test. Previously these three steps lived in the build-test kernel
  # shard (static_checks gate), meaning a red Test shard would silently mask
  # codegen drift. Moving them to an independent job ensures codegen drift
  # always surfaces regardless of test failures.
  #
  # No `needs:` — runs in parallel with build-test and integration-test.
  # ref: kubernetes/kubernetes hack/verify-*.sh independent Prow presubmit
  # ref: kubernetes-sigs/kubebuilder .github/workflows/verify.yml
  verify-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Generated-artifact gate (PR-CFG-M follow-up):
      # assembly.yaml is the source-of-truth for runtime cell order, generated
      # entrypoint paths, boundary contracts, and assembly-reachable metrics
      # schemas. The verifier derives the expected artifact manifest from
      # metadata instead of trusting generator stdout to define the diff scope.
      - name: Verify generated artifacts are up-to-date
        run: go run ./cmd/gocell verify generated

      # K#04 codegen-cell gate: cell_gen.go / slice_gen.go must be in sync
      # with cell.yaml / slice.yaml. Sandbox mode runs the generator inside
      # an ephemeral git worktree at HEAD and uses `git status --porcelain`
      # for drift detection, mirroring kubernetes/kubernetes
      # hack/lib/verify-generated.sh.
      - name: Verify cell codegen (K#04)
        run: ./hack/verify-codegen-cell.sh

      # K#06 codegen-contract gate: generated/contracts/**/*_gen.go must be in
      # sync with contract.yaml + JSON schemas. Sandbox mode mirrors the K#04
      # cell codegen gate pattern.
      - name: Verify contract codegen (K#06)
        run: ./hack/verify-codegen-contract.sh

      - name: Verify assembly codegen (K#10)
        run: ./hack/verify-codegen-assembly.sh

      - name: Verify shared-schema codegen
        run: ./hack/verify-codegen-shared-schema.sh

      # Proto codegen gate: generated/contracts/grpc/**/*.pb.go must be in sync
      # with contracts/grpc/**.proto. The pipeline (buf + protoc-gen-go +
      # protoc-gen-go-grpc) is hermetic via `go run` — no buf/protoc install,
      # just the setup-go above + module cache. See contracts/grpc/README.md.
      - name: Verify proto codegen (buf)
        run: ./hack/verify-codegen-proto.sh

      - name: Verify scaffold bundle (sandbox)
        run: ./hack/verify-scaffold-bundle.sh
      - name: Verify scaffold assembly (sandbox)
        run: ./hack/verify-scaffold-assembly.sh
      - name: Verify scaffold rejection (kebab guard)
        run: ./hack/verify-scaffold-reject.sh
