name: Release

# Tag / release pipeline for GoCell (issue #1724).
#
# Two paths, one mechanism:
#   * workflow_dispatch — an operator cuts a STABLE release by typing the
#     version (e.g. 0.0.2). Tag vX.Y.Z, full release (becomes "Latest").
#   * schedule (daily) — automatic develop SNAPSHOT. Version is
#     v<base>-develop.<UTC timestamp>, where <base> is the latest stable
#     version (default 0.0.1). Marked prerelease (never "Latest"), skipped
#     when develop HEAD is unchanged since the last snapshot, and pruned to
#     the most recent DAILY_RETENTION snapshots.
#
# The tag is the single source of truth for the version; no version constant is
# embedded in binaries and CHANGELOG.md is maintained by hand.
#
# Version strings follow SemVer 2.0.0. The snapshot timestamp is encoded as a
# single ISO-basic pre-release identifier (e.g. 20260607T021500Z) so it is NOT
# a numeric identifier — the "no leading zeros" rule (semver.org §9) would
# reject a dotted form like `…-develop.021500`.
# ref: nodejs nightly (vX-nightly<date>), dotnet (-preview.<date>) tag schemes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'STABLE release version WITHOUT the v prefix, e.g. 0.0.2. Numeric X.Y.Z, strictly greater than the latest stable tag.'
        type: string
        required: true
  schedule:
    - cron: '0 2 * * *' # daily develop snapshot, 02:00 UTC

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DAILY_RETENTION: '14' # keep this many most-recent daily snapshots; older are pruned

jobs:
  verify:
    name: Resolve version & build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
    steps:
      - name: Validate branch
        # schedule runs on the default branch (develop); dispatch must too.
        # Context values go through env, never interpolated into the shell, to
        # avoid script injection from a crafted ref name.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "develop" ]; then
            echo "::error::Release must run on develop (got '$REF_NAME')."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: develop
          fetch-depth: 0 # full history + tags for version resolution
          fetch-tags: true

      - name: Resolve version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          # SemVer 2.0.0: numeric identifiers carry no leading zeros.
          num='(0|[1-9][0-9]*)'
          latest_stable="$(git tag -l 'v[0-9]*' --sort=-v:refname \
            | grep -E "^v${num}\.${num}\.${num}$" | head -n1 || true)"
          tag_exists=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            ver="$INPUT_VERSION"
            if ! printf '%s' "$ver" | grep -Eq "^${num}\.${num}\.${num}$"; then
              echo "::error::version must be SemVer X.Y.Z with no leading zeros or leading v (got '$ver')."
              exit 1
            fi
            tag="v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # Tag exists: resumable only if it points at the verified commit and
              # its release is missing (recovering a prior half-finished run).
              existing_sha="$(git rev-parse "$tag^{commit}")"
              if [ "$existing_sha" != "$head_sha" ]; then
                echo "::error::tag $tag exists at $existing_sha, not the current develop HEAD $head_sha."
                exit 1
              fi
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::release $tag already exists (nothing to do)."
                exit 1
              fi
              echo "::warning::tag $tag exists without a release — resuming to create it." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              tag_exists=true
            elif [ -n "$latest_stable" ]; then
              # New tag: enforce strictly-increasing version vs the latest stable.
              newest="$(printf '%s\n%s\n' "$latest_stable" "$tag" | sort -V | tail -n1)"
              if [ "$newest" != "$tag" ]; then
                echo "::error::version $tag must be greater than the latest stable release $latest_stable."
                exit 1
              fi
            fi
            {
              echo "tag=$tag"
              echo "prerelease=false"
            } >>"$GITHUB_OUTPUT"
          else
            base="${latest_stable#v}"
            base="${base:-0.0.1}"
            last_daily="$(git tag -l 'v*-develop.*' --sort=-creatordate | head -n1 || true)"
            # ^{commit} peels the annotated tag to its commit for a commit-to-commit compare.
            if [ -n "$last_daily" ] \
              && [ "$(git rev-parse "$last_daily^{commit}")" = "$head_sha" ]; then
              echo "No new commits on develop since $last_daily — skipping snapshot." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ts="$(date -u +%Y%m%dT%H%M%SZ)"
            {
              echo "tag=v${base}-develop.${ts}"
              echo "prerelease=true"
            } >>"$GITHUB_OUTPUT"
          fi
          {
            echo "skip=false"
            echo "sha=$head_sha"
            echo "tag_exists=$tag_exists"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.resolve.outputs.skip != 'true'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Build smoke (compile all modules)
        if: steps.resolve.outputs.skip != 'true'
        run: make check-build

      - name: Unit smoke (kernel, docker-free)
        if: steps.resolve.outputs.skip != 'true'
        run: go test ./framework/kernel/... -count=1

      # F1/C1: validate the goreleaser config BEFORE the release job pushes any
      # tag. A broken .goreleaser.yaml caught here fails the run with zero side
      # effects (no tag, no GHCR image); without this the tag would be pushed
      # first and goreleaser would only fail afterwards, leaving an orphan tag.
      - name: Install goreleaser
        if: steps.resolve.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: 'v2.16.0' # pinned (F6); bump via dependabot
          install-only: true

      - name: goreleaser config check (pre-tag, no side effects)
        if: steps.resolve.outputs.skip != 'true'
        run: goreleaser check

  release:
    name: Tag & GitHub Release
    needs: verify
    if: needs.verify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # F9: raised from 30 to 45 — cross-arch QEMU docker build + multi-arch push
    # 基准；首次 stable release 后按实测回调。
    timeout-minutes: 45
    permissions:
      contents: write  # push annotated tag + create/delete GitHub Release
      # F11: packages:write は job 级（GitHub Actions 不支持 step-level permissions），
      # snapshot 路径同样持有但不使用（snapshot 不触发 goreleaser）；
      # token 仓库内 scope，无额外可利用面。
      packages: write  # push container images to ghcr.io (stable only, #1088)
    env:
      # GH_TOKEN (write-scope) is deliberately NOT set at job level — it is scoped
      # per-step to only the `gh release` API steps, so the repo-code steps
      # (modrelease `go run`, git tag/push via checkout creds) never see it.
      TAG: ${{ needs.verify.outputs.tag }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.sha }} # pin to the exact commit verify smoke-tested
          fetch-depth: 0 # full history for annotated tag, --generate-notes, prune
          fetch-tags: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        # Stable (fresh OR resume) runs the modrelease tool (bump / tag-path
        # derivation / resume tag-set validation); snapshots are root-only git ops.
        if: needs.verify.outputs.prerelease != 'true'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Pin internal requires & commit (stable only)
        # Synchronized multi-module release (#1843): pin every publishable LIBRARY
        # module's internal requires v0.0.0 -> vX.Y.Z (keeping replace) on a local
        # commit — the single tag target for root and all satellites. It is NEITHER
        # pushed NOR tagged here: the pinned tree is first re-verified (next step),
        # so the released commit is never an unverified tree (F1). Snapshots skip.
        if: needs.verify.outputs.tag_exists != 'true' && needs.verify.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checked-out HEAD $(git rev-parse HEAD) != verified SHA $SHA."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go run ./tools/modrelease/cmd --version "$TAG"
          if git diff --quiet; then
            echo "::warning::modrelease pinned no requires (already at $TAG?) — tagging $SHA as-is." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -am "release($TAG): pin internal module requires"
          fi

      - name: Verify pinned tree (stable only)
        # The verify job ran the build gates on the PRE-pin develop SHA. Re-run the
        # release-consistency gates on the actual pin commit so the tagged tree is
        # the verified tree, not just the pre-pin one (F1). Runs before any push or
        # tag, so a failure leaves develop unadvanced and no tag minted. Skips when
        # the pin was a no-op (HEAD == SHA, already verified).
        if: needs.verify.outputs.tag_exists != 'true' && needs.verify.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$SHA" ]; then
            echo "pin was a no-op (HEAD == verified SHA) — skipping re-verify."
            exit 0
          fi
          make check-build
          bash hack/verify-workspace.sh

      - name: Tag modules
        # Snapshots tag the bare $TAG only. Stable mints the bare $TAG as the GitHub
        # Release MARKER tag (NOT a module tag: post-#1565 no module sits at the repo
        # root, so modrelease's --print-tag-paths correctly emits only the per-module
        # <reldir>/vX.Y.Z library tags — see modrelease_test.go TestTagPaths). The
        # workflow prepends the bare marker to those library tags and pushes the
        # whole set --atomic so a partial set never lands. This restores the pre-#1565
        # ref topology — a bare vX.Y.Z at the release commit alongside every library
        # tag — which `gh release create --verify-tag`, goreleaser {{.Tag}}, and the
        # verify-job resume sentinel all resolve against (k8s/gopls convention; #2134).
        # Guarded by RELEASE-STABLE-MARKER-TAG-01.
        #
        # Resume: the verify job's tag_exists check inspects only the bare MARKER tag.
        # The --atomic push makes marker + library tags land all-or-nothing, so the
        # marker normally reflects the whole set — but on a stable resume the next step
        # ("Validate satellite tag set") additionally proves every library tag exists
        # and peels to the same commit, fail-closed (F3), rather than trusting the
        # atomic invariant alone.
        if: needs.verify.outputs.tag_exists != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRERELEASE" = "true" ]; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            exit 0
          fi
          mapfile -t module_tags < <(go run ./tools/modrelease/cmd --version "$TAG" --print-tag-paths)
          if [ "${#module_tags[@]}" -lt 2 ]; then
            echo "::error::modrelease produced ${#module_tags[@]} library tag(s) for $TAG; expected the full publishable module set."
            exit 1
          fi
          # The bare $TAG is the GitHub Release MARKER tag, prepended to the per-module
          # library tags. modrelease never emits it (post-#1565 no module sits at the
          # repo root; see modrelease_test.go TestTagPaths), so the workflow mints it
          # here — restoring the pre-#1565 ref topology that `gh release create
          # --verify-tag`, goreleaser {{.Tag}}, and the verify-job resume sentinel
          # resolve against (#2134, RELEASE-STABLE-MARKER-TAG-01).
          tags=("$TAG" "${module_tags[@]}")
          # Operator-visible preview of the exact set about to be pushed.
          {
            echo "### Release $TAG — marker tag + ${#module_tags[@]} library module tags"
            printf -- '- %s\n' "${tags[@]}"
          } >>"$GITHUB_STEP_SUMMARY"
          # Push the now-verified pin commit to develop (only if one was created).
          # A non-fast-forward push means develop advanced since verify (often a
          # prior pin commit in this same release): the operator must RE-DISPATCH
          # from the new develop HEAD, not "Re-run jobs" (re-run replays the stale
          # SHA). Requires branch protection to permit the github-actions bot push.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            if ! git push origin "HEAD:develop"; then
              echo "::error::push to develop rejected (non-fast-forward, or bot lacks branch-protection write). develop has advanced since verify resolved SHA=$SHA — RE-DISPATCH this workflow from the new develop HEAD (do NOT 'Re-run jobs', which replays the stale SHA)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          for tag in "${tags[@]}"; do
            git tag -a "$tag" -m "Release $tag"
          done
          git push origin --atomic "${tags[@]}"

      - name: Validate satellite tag set (stable resume)
        # On resume the bare marker tag exists but the GitHub Release is missing.
        # tag_exists is set off the MARKER tag only, so before creating the release
        # prove the FULL synchronized set is present and consistent: every library tag
        # must exist and peel to the same commit as the marker, else fail closed (F3).
        # This catches a prior run that tagged the marker but lost the library
        # --atomic push.
        if: needs.verify.outputs.tag_exists == 'true' && needs.verify.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          marker_commit="$(git rev-parse "$TAG^{commit}")"
          mapfile -t module_tags < <(go run ./tools/modrelease/cmd --version "$TAG" --print-tag-paths)
          [ "${#module_tags[@]}" -ge 2 ] || { echo "::error::derived library tag set too small (${#module_tags[@]})."; exit 1; }
          missing=0
          for tag in "${module_tags[@]}"; do
            if ! c="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
              echo "::error::resume: library tag '$tag' is missing (marker tagged but library set incomplete)."
              missing=1
            elif [ "$c" != "$marker_commit" ]; then
              echo "::error::resume: tag '$tag' points at $c, not the marker tag commit $marker_commit."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::resume aborted: library tag set incomplete/inconsistent — delete the partial tags and re-dispatch." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

      # ── goreleaser: CLI binary + docker (stable only) ──────────────────────
      # Runs after tags are pushed so goreleaser can resolve {{.Tag}} from the
      # annotated tag. All four steps below are gated on prerelease != 'true';
      # the snapshot / daily path is completely untouched.
      #
      # F10: 半发布态说明 — goreleaser 先 push docker 再由后续 step 建 GH release。
      # 若 smoke/release 步骤失败，进入「docker-pushed-but-no-release」态。
      # re-dispatch 时 docker push 幂等（同 tag 覆盖），只需让 gh release create 完成。
      # resume 校验当前不查 ghcr 镜像存在性（镜像幂等，无需重查）。

      - name: Set up Go for CLI sub-module (stable only)
        # Separate setup-go call targeting cmd/gocell/go.mod so goreleaser
        # can cache the CLI module's dependencies independently from the root.
        if: needs.verify.outputs.prerelease != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cmd/gocell/go.mod
          cache-dependency-path: cmd/gocell/go.sum

      - name: Set up QEMU (stable only)
        # linux/arm64 docker layers are built on an amd64 runner via QEMU
        # emulation; required for the multi-arch manifest in .goreleaser.yaml.
        if: needs.verify.outputs.prerelease != 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx (stable only)
        # The default docker driver cannot emit multi-platform images; buildx
        # (docker-container driver) is required for goreleaser dockers_v2 to
        # build + push the linux/amd64 + linux/arm64 manifest.
        if: needs.verify.outputs.prerelease != 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io (stable only)
        # F5: 统一使用 github.token（与本 workflow 其他 gh API 步骤一致，消除 PAT fallback 歧义）。
        # job 已声明 packages:write，权限等价。
        if: needs.verify.outputs.prerelease != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install goreleaser (stable only)
        if: needs.verify.outputs.prerelease != 'true'
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: 'v2.16.0' # pinned (F6); bump via dependabot
          install-only: true

      - name: Pre-publish version smoke (no side effects, stable only)
        # F1/C1: validate the ldflags-injected version BEFORE any publish side
        # effect (GHCR push). A single-target build (runner arch only — no
        # archives, no docker, no publish) yields a binary we smoke-test for
        # cliVersion == tag. If this fails, NOTHING has been pushed to GHCR yet
        # — fail-closed BEFORE the side effect, not after (the previous
        # post-publish smoke could only block the GitHub Release, never the
        # already-pushed image). Config validity was checked pre-tag in verify.
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GOWORK: "off"
          # Pin goreleaser's {{.Tag}} to the bare marker (#2134): the marker + N
          # library tags share the release commit, so git-describe resolution is
          # ambiguous; an unpinned {{.Tag}} could resolve to framework/vX.Y.Z and
          # fail the cliVersion == $TAG smoke below (and corrupt ldflags / docker tag).
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          goreleaser build --single-target --clean
          # goreleaser v2 single-target layout: dist/gocell_linux_amd64_v1/gocell
          bin="dist/gocell_linux_amd64_v1/gocell"
          if [ ! -f "$bin" ]; then
            n=$(find dist -name 'gocell' -path '*linux_amd64*' | wc -l)
            if [ "$n" -eq 1 ]; then
              bin="$(find dist -name 'gocell' -path '*linux_amd64*')"
            else
              echo "::error::expected exactly 1 linux-amd64 binary in dist/, found $n (goreleaser build failed or layout changed)."
              exit 1
            fi
          fi
          chmod +x "$bin"
          actual="$("$bin" version --format json | jq -r '.cliVersion')"
          echo "pre-publish version smoke: cliVersion=$actual, expected=$TAG"
          if [ "$actual" = "dev" ]; then
            echo "::error::cliVersion is 'dev' — ldflags injection did not apply."
            exit 1
          fi
          if [ "$actual" != "$TAG" ]; then
            echo "::error::cliVersion '$actual' != expected tag '$TAG' — ldflags symbol drift."
            exit 1
          fi
          echo "pre-publish gate passed: cliVersion=$actual" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish CLI artifacts with goreleaser (stable only)
        # Version + config already vetted (pre-publish smoke above; pre-tag
        # `goreleaser check` in the verify job), so this performs the now-vetted
        # publish: cross-arch binaries + archives + checksums into dist/ AND the
        # multi-arch docker manifest pushed to ghcr. --skip=publish is NOT passed
        # (it would skip the docker push too); the GitHub Release is suppressed
        # via .goreleaser.yaml (release.disable: true) so the `gh release create`
        # step below stays the sole owner of the release + snapshot logic. Tags
        # are already pushed, so goreleaser resolves {{.Tag}}.
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GOWORK: "off"
          # Pin {{.Tag}} to the bare marker (#2134): deterministic across the marker +
          # library tags that share the release commit (see pre-publish smoke step).
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      # ── end goreleaser block ────────────────────────────────────────────────

      - name: Release installable CLI module (cmd/gocell, stable only)
        # #2045: make `go install github.com/ghbvf/gocell/cmd/gocell@vX.Y.Z` work.
        # Ordered BEFORE "Create GitHub Release" (Codex F1): the public GitHub
        # Release is the FINAL user-visible signal, emitted only after EVERY stable
        # deliverable — including this installable CLI tag + go-install smoke —
        # verifies. If this step fails, no GitHub Release exists yet, so a same-
        # version re-dispatch resumes cleanly; were the Release already published,
        # the verify job's "release already exists" guard (Resolve version) would
        # block recovery, stranding a fail-open release whose advertised
        # `go install @version` deliverable never landed.
        # The CLI sub-module carries local `replace` directives for monorepo dev,
        # and `go install pkg@version` is rejected OUTRIGHT when the target go.mod
        # has ANY replace. So — AFTER the library tags (root + satellites) are
        # pushed (root@vX.Y.Z et al. now resolvable) AND after goreleaser built the
        # binary/docker from the replace-intact tree — strip cmd/gocell's replace,
        # pin its internal requires to the release version, re-tidy go.sum against
        # the published tags, verify, and tag `cmd/gocell/vX.Y.Z` at a SEPARATE tree
        # (a child commit touching only cmd/gocell/go.{mod,sum}; the tag is pushed
        # but develop is NOT advanced by it). This is the "separate tagged-tree
        # shape" foreseen by tools/modrelease/modrelease.go. The strip/pin transform
        # and the installable tag set are the modrelease single source
        # (--installable / --print-installable-tags), guarded by
        # INSTALLABLE-STRIP-TRANSFORM-01 / INSTALLABLE-BINARY-SET-01.
        #
        # GOWORK scoping: `go run ./tools/modrelease/cmd` MUST run with the
        # workspace active — `tools` is a satellite module unreachable from the
        # ROOT module under GOWORK=off (go would error "main module does not
        # contain package …/tools/modrelease/cmd"). Only the cmd/gocell module
        # commands + the go-install smoke set GOWORK=off (per-command), so
        # cmd/gocell resolves against its OWN pinned go.mod, not the workspace.
        # GOPROXY=direct + GOSUMDB=off: resolve the just-pushed tags straight from
        # the repo without waiting for proxy.golang.org / sum.golang.org
        # propagation (the tags may not be index-visible yet).
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The installable tag set is the modrelease single source. This step
          # handles a SINGLE installable binary — the frozen set is {cmd/gocell}
          # (INSTALLABLE-BINARY-SET-01). Assert that, so a future addition fails
          # LOUD here (a maintainer must generalize this step to loop tag/commit/
          # push/smoke per binary) rather than silently tagging only the first.
          # Runs with the workspace active (tools is a satellite module).
          mapfile -t installable_tags < <(go run ./tools/modrelease/cmd --version "$TAG" --print-installable-tags)
          if [ "${#installable_tags[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 installable tag, got ${#installable_tags[@]} (${installable_tags[*]:-none}). installableBinaries grew — generalize this step to loop over every installable tag."
            exit 1
          fi
          installable_tag="${installable_tags[0]}"
          mod_dir="${installable_tag%/*}"                          # cmd/gocell/v0.1.0 -> cmd/gocell
          mod_path="$(awk 'NR==1{print $2}' "${mod_dir}/go.mod")"  # module import path (line 1, replace-agnostic)
          # Resume / idempotency: a pushed tag is fetched by the checkout
          # (fetch-tags: true), so if it already exists, prove its tree is the
          # stripped shape (no replace) and skip re-tagging — never re-mint.
          if existing="$(git rev-parse -q --verify "refs/tags/${installable_tag}^{commit}" 2>/dev/null)"; then
            # Validate the existing tag's tree is a COMPLETE installable shape, not
            # just replace-free (F2): every internal require must already be pinned to
            # THIS $TAG. The go-install smoke below only checks the main module's
            # cliVersion, which would still pass even if a framework dep pointed at a
            # stale tag — so verify the require versions here too, fail-closed.
            existing_mod="$(mktemp)"
            git show "${installable_tag}:${mod_dir}/go.mod" >"${existing_mod}"
            if grep -q '^replace ' "${existing_mod}"; then
              echo "::error::existing ${installable_tag} tree still contains replace — corrupt installable release; delete the tag and re-dispatch."
              exit 1
            fi
            if go mod edit -json "${existing_mod}" \
              | jq -e --arg t "$TAG" '(.Require // []) | any((.Path | startswith("github.com/ghbvf/gocell")) and (.Version != $t))' >/dev/null; then
              echo "::error::existing ${installable_tag} has internal require(s) not pinned to $TAG — corrupt (stale framework deps); delete the tag and re-dispatch."
              exit 1
            fi
            echo "${installable_tag} already exists at ${existing} (stripped + internal requires pinned to $TAG) — skipping re-tag." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # Strip replace + pin internal requires to $TAG (modrelease single source).
            go run ./tools/modrelease/cmd --version "$TAG" --installable
            # The cmd/gocell module commands resolve against its OWN pinned go.mod
            # (GOWORK=off, per-command), not the workspace.
            GOWORK=off go -C "${mod_dir}" mod tidy            # repopulate go.sum from the published tags
            GOWORK=off go -C "${mod_dir}" build ./...         # stripped tree must BUILD...
            GOWORK=off go -C "${mod_dir}" list -m all >/dev/null  # ...and resolve its FULL graph (go-install-equivalent)
            # Defense-in-depth: the tree we are about to tag must carry no replace,
            # else `go install pkg@version` would still be rejected.
            if grep -q '^replace ' "${mod_dir}/go.mod"; then
              echo "::error::${mod_dir}/go.mod still has replace after --installable — refusing to tag."
              exit 1
            fi
            # Commit the separate installable tree (child of HEAD, ONLY this module's
            # go.mod/go.sum) and tag it. Only the tag is pushed; develop is NOT advanced.
            git commit -m "release(${installable_tag}): strip replace + pin requires for go install" -- "${mod_dir}/go.mod" "${mod_dir}/go.sum"
            git tag -a "${installable_tag}" -m "Release ${installable_tag}"
            git push origin "${installable_tag}"
            echo "tagged ${installable_tag} at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Post-publish smoke: the real external-consumer path. `go install
          # MODPATH@VERSION` takes the MODULE VERSION ($TAG, e.g. v0.1.0) — Go maps
          # the submodule git tag (cmd/gocell/v0.1.0) to that version — NOT the git
          # tag name. It injects no ldflags, so resolveVersion falls back to
          # build-info Main.Version (the module version). Coverage boundary:
          # GOSUMDB=off means this smoke does NOT exercise the sum.golang.org path a
          # real consumer hits once propagated — it verifies tag-resolves +
          # binary-runs + version-stamp only (the sumdb residual is the
          # "run once by hand" gap, see tools/releasesmoke/doc.go).
          smoke="$(mktemp -d)"
          GOWORK=off GOBIN="${smoke}/bin" go install "${mod_path}@$TAG"
          actual="$("${smoke}/bin/$(basename "${mod_path}")" version --format json | jq -r '.cliVersion')"
          echo "go-install smoke: cliVersion=${actual}, expected=$TAG"
          if [ "$actual" != "$TAG" ]; then
            echo "::error::go install ${mod_path}@$TAG reports cliVersion '${actual}' != '$TAG' — installable release broken. ${installable_tag} is already pushed; if transient, re-dispatch (the tag is validated + reused, smoke re-runs). If cliVersion is structurally wrong, delete ${installable_tag} and re-dispatch." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ go install ${mod_path}@$TAG verified (cliVersion=${actual})" | tee -a "$GITHUB_STEP_SUMMARY"

      # ── Final user-visible signal ───────────────────────────────────────────
      # Create the GitHub Release LAST (Codex F1): only after every stable
      # deliverable — library/satellite tags, goreleaser binaries+docker, AND the
      # installable cmd/gocell tag + go-install smoke above — has verified. A
      # failure in any prior step leaves recoverable half-state (pushed tags /
      # docker, no Release), so a same-version re-dispatch resumes; the Release
      # itself is never published ahead of an unverified deliverable.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }} # write-scope token scoped to the gh API step only (F5)
        run: |
          set -euo pipefail
          args=(--title "$TAG" --verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            # F2/C1: the cross-arch tarballs + checksums ARE the stable release
            # (#1088 DoD), not optional attachments. Fail loudly if goreleaser
            # did not produce exactly the 4 platform archives (.goreleaser.yaml
            # builds linux/darwin × amd64/arm64) + checksums.txt, rather than
            # publishing a release missing its core deliverables.
            mapfile -t artifacts < <(compgen -G "dist/gocell_*.tar.gz" || true)
            if [ "${#artifacts[@]}" -ne 4 ]; then
              echo "::error::expected 4 platform tarballs in dist/, found ${#artifacts[@]} — aborting release (core deliverable missing)."
              exit 1
            fi
            if [ ! -f "dist/checksums.txt" ]; then
              echo "::error::dist/checksums.txt missing — aborting release (core deliverable missing)."
              exit 1
            fi
            args+=("${artifacts[@]}" "dist/checksums.txt")
          fi
          # Retry: the freshly pushed tag may not be API-visible immediately,
          # which makes --verify-tag fail transiently and leaves an orphan tag.
          for attempt in 1 2 3; do
            if gh release create "$TAG" "${args[@]}"; then
              exit 0
            fi
            echo "::warning::gh release create attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "::error::gh release create failed for $TAG after 3 attempts (tag is pushed; re-run this workflow to resume, or create the release manually)."
          exit 1

      - name: Prune old daily snapshots
        if: needs.verify.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # write-scope token scoped to the gh API step only (F5)
        run: |
          set -euo pipefail
          if ! printf '%s' "$DAILY_RETENTION" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::DAILY_RETENTION must be a positive integer (got '$DAILY_RETENTION')."
            exit 1
          fi
          # Keep the most recent DAILY_RETENTION snapshots (today's included);
          # delete older release+tag pairs together via --cleanup-tag.
          git tag -l 'v*-develop.*' --sort=-creatordate \
            | tail -n +"$((DAILY_RETENTION + 1))" \
            | while IFS= read -r old; do
                [ -n "$old" ] || continue
                # Defense-in-depth: only delete tags that match the snapshot shape
                # exactly, so a glob surprise never deletes a real release tag.
                printf '%s' "$old" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-develop\.' || {
                  echo "::warning::skipping prune of unexpected tag '$old' (not a develop snapshot)."
                  continue
                }
                echo "Pruning old snapshot $old"
                gh release delete "$old" --cleanup-tag --yes \
                  || git push origin --delete "$old" \
                  || echo "::warning::failed to prune snapshot $old."
              done
