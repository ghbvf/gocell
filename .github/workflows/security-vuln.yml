name: Security · govulncheck

# Supply-chain layer: scan go.mod dependencies (and call-graph reachability)
# against Go's official vulnerability database (golang.org/x/vuln).
# ref: golang.org/x/vuln/cmd/govulncheck CLI docs
#
# Real blocking semantics — govulncheck `-format sarif` exits 0 even on
# findings (per its docs: "exits successfully if -format json/sarif/openvex
# is provided, regardless of detected vulnerabilities"). We therefore run
# text mode first as the gate, then SARIF mode (always-true) for upload so
# the Security tab picture is intact even when the gate fails.
#
# Policy enforced *by CI*:
#   - text-mode govulncheck has no -skip / --ignore flags (verify-supply-
#     chain-clean.sh forbids any such flag in this file).
#   - .govulncheckignore must NOT exist (same gate).
#   - Non-zero exit on the text-mode step fails the PR; only fix path is
#     upgrade or remove the vulnerable code path.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main, 'release/**']
  schedule:
    # Weekly Mon 18:17 UTC — intentionally collides with otel-collector-nightly
    # on Mondays (independent workflows, no shared lock needed).
    - cron: '17 18 * * 1'
  workflow_dispatch:

# Workflow-level permissions are read-only (least privilege). Each job that
# needs security-events: write declares it at job level.
permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Module-aware traversal (#1556) runs govulncheck once per go.work member
    # (root + satellites: examples, cmd, corecells, tools, tests, and the 14
    # per-adapter modules from #1558) × 2 passes (text gate + SARIF); the
    # 5-minute single-module budget no longer fits, so raised to 12.
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write   # required by upload-sarif
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: govulncheck (text — gate)
        # Module-aware (#1556): examples/* are their own go.work modules, so a
        # root `govulncheck ./...` stops at the nested-module boundary and never
        # scans the 5 satellite example modules (govulncheck's call-graph
        # reachability is per-module — each example main wires a distinct
        # reachable set). Enumerate every workspace member from the SAME go.work
        # funnel the build/test gates use (hack/lib/modules.sh → `go work edit
        # -json`) and run govulncheck per module. Text mode exits non-zero on
        # findings — this is the actual gate; the loop fails on the first module
        # with a finding. No -skip / --ignore: bypass surface stays closed
        # (verify-supply-chain-clean.sh forbids those flags in this file).
        run: |
          set -euo pipefail
          source hack/lib/util.sh
          source hack/lib/modules.sh
          # Command substitution (NOT `while read < <(...)`) so a go.work path-
          # validation failure in the funnel propagates under `set -e`.
          module_dirs="$(gocell::modules::dirs)"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "+++ govulncheck (text) in module: $dir"
            ( cd "$dir" && govulncheck ./... )
          done <<<"$module_dirs"

      - name: govulncheck (SARIF — for Security tab)
        if: always()
        # SARIF mode always exits 0 (per govulncheck docs); always run so the
        # SARIF reports upload even when the text-mode gate above failed. One
        # SARIF per workspace member (same funnel as the gate). Each run is
        # stamped with a DISTINCT `automationDetails.id` (= its Code Scanning
        # category) via jq — the CodeQL upload action rejects multiple SARIF
        # runs sharing one category (github.blog 2025-07-21), so a single shared
        # `category:` input on the upload steps below is removed and the per-run
        # id drives a distinct category per module instead.
        #
        # GitHub Code Scanning also rejects any single SARIF submission carrying
        # >20 runs. With one run per go.work module the workspace exceeds that
        # (29 members after the #1558 adapter-per-module split), so partition the
        # per-module SARIFs into batch-<n>/ directories of <=BATCH_CAP runs each
        # and upload each batch in its own step below. The per-run id keeps every
        # module a distinct analysis, so disjoint batches never clobber each other.
        run: |
          set -euo pipefail
          source hack/lib/util.sh
          source hack/lib/modules.sh
          BATCH_CAP=19   # margin under GitHub's 20-runs-per-submission limit
          module_dirs="$(gocell::modules::dirs)"
          i=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            batch=$(( i / BATCH_CAP + 1 ))
            mkdir -p "govulncheck-sarif/batch-$batch"
            if [ "$dir" = "." ]; then slug=root; else slug="$(printf '%s' "${dir#./}" | tr '/' '-')"; fi
            echo "+++ govulncheck (sarif) module: $dir -> batch-$batch/govulncheck-$slug.sarif"
            ( cd "$dir" && govulncheck -format sarif ./... ) \
              | jq --arg id "govulncheck/$slug" '.runs |= map(.automationDetails = {"id": $id})' \
              > "govulncheck-sarif/batch-$batch/govulncheck-$slug.sarif"
            i=$(( i + 1 ))
          done <<<"$module_dirs"
          batches=$(find govulncheck-sarif -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "govulncheck SARIF: $i modules in $batches batch(es) of <=$BATCH_CAP runs"
          # Fail-fast machine guard: only batch-1/batch-2 have upload steps below.
          # If the workspace grows past 2*BATCH_CAP modules, add a batch-3 upload
          # step rather than silently dropping a batch from the Security tab.
          if [ "$batches" -gt 2 ]; then
            echo "FAIL: $batches SARIF batches but only 2 upload steps exist — add an 'Upload SARIF batch 3' step (workspace exceeded 2*$BATCH_CAP modules)." >&2
            exit 1
          fi

      - name: Upload SARIF batch 1
        if: always() && hashFiles('govulncheck-sarif/batch-1/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        # No `category:` input — each SARIF carries its own per-module
        # `automationDetails.id` (set above) so the runs upload as distinct
        # categories rather than colliding under one shared category.
        with:
          sarif_file: govulncheck-sarif/batch-1

      - name: Upload SARIF batch 2
        if: always() && hashFiles('govulncheck-sarif/batch-2/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          sarif_file: govulncheck-sarif/batch-2
