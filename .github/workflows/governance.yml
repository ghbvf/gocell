name: Governance Strict

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [develop, main, 'release/**']
    # Skip governance on purely-documentation PRs. `docs/**` and top-level
    # *.md files do not affect `gocell validate` output (confirmed: cmd/gocell
    # does not load .claude/rules or docs/ at runtime). push to develop/main
    # is NOT filtered — it acts as the unconditional baseline sweep.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      # README.md intentionally omitted: it is already covered by the '*.md'
      # glob above. Keeping it separately was redundant.
      # Note: '.claude/rules/*.md' is intentionally NOT in this ignore list —
      # changes to AI-robust rules (ai-robust.md, eventbus.md, etc.) should
      # trigger governance re-validation since they may affect validate output.

# Governance Strict is the K8s-style `make verify` runner — it discovers and
# executes every hack/verify-*.sh gate in deterministic order, accumulating
# failures. Adding a new gate is a single new file under hack/; this workflow
# never needs to change.
# ref: kubernetes/kubernetes hack/make-rules/verify.sh

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    # `make verify` discovers and runs every hack/verify-*.sh gate. The 4
    # core invariant groups (clock-injection, duration-const, test-time-literal,
    # panic-registered) are PR-time gates via hack/verify-archtest-invariants.sh
    # (~33s, PR #898 measured; single shared-resolver go test invocation).
    # The complete archtest suite (628+ tests) is delegated to
    # .github/workflows/archtest-nightly.yml (matrix of 16 shards on a daily
    # schedule + workflow_dispatch, process-isolated per ADR 202605120000
    # §Amendment 2026-05-23-pr-time-to-nightly) — that job is the **single
    # authoritative owner** of full archtest enforcement on CI.
    # hack/githooks/pre-push omits archtest after PR #887 review round-2
    # (CPU/RSS budget — ~3min wall + 43 GB RSS + 18-core 100% violates the
    # hook's sub-10s deterministic contract; see ADR §"pre-push archtest 撤回").
    #
    # 15 min covers cold module cache plus all verify-*.sh gates running
    # continue-on-failure (hack/make-rules/verify.sh accumulates failures
    # across gates). 4 PR-time archtest gate 合并后 ~33s（PR #898 实测），仍在
    # 15min 预算内。
    timeout-minutes: 15 # 4 PR-time archtest gate 合并后 ~33s（PR #898 实测），仍在 15min 预算内
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pre-compile gocell once and share across the 11 verify-*.sh gates that
      # invoke it. Each `go run ./cmd/gocell` cold-links 18 MB (~1.2-1.8s);
      # building once and injecting GOCELL_BIN saves ~16s per CI run.
      # hack/lib/gocell-bin.sh::gocell::cli checks GOCELL_BIN first, falls
      # back to `go run` when unset (local dev path unchanged).
      # Same pattern also in _build-lint.yml verify-codegen job — keep in sync.
      - name: Build gocell binary
        run: go build -o "$RUNNER_TEMP/gocell" ./cmd/gocell

      - name: make verify
        # VERIFY_SKIP=archtest: delegate archtest to the matrix
        # archtest-nightly.yml job (single-owner principle, see comment
        # above). gofumpt is NOT in the skip list — hack/verify-gofumpt.sh
        # bootstraps golangci-lint at the pinned version via
        # hack/lib/golangci-lint.sh (one-time go install on a cold setup-go
        # cache). The CI lint shard in _build-lint.yml uses golangci-lint-
        # action for its build cache and `config verify`; both consumers
        # share GOLANGCI_LINT_VERSION = v2.11.4.
        #
        # Local `make verify` (no env) still runs verify-archtest.sh (K=1
        # default; PR #878). This is the developer-facing local sweep and
        # is by-design slowgate-less (the budget gate is a CI concern;
        # local dev focuses on correctness).
        env:
          VERIFY_SKIP: archtest
          GOCELL_BIN: ${{ runner.temp }}/gocell
        run: make verify
