name: MQTT TLS Nightly

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: mqtt-tls-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mqtt-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCELL_TEST_DOCKER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: MQTT mTLS integration
        run: |
          set -o pipefail
          go test -json -v -tags='integration mqtt_tls' github.com/ghbvf/gocell/adapters/mqtt/... -count=1 -timeout 10m 2>&1 | tee mqtt-tls-nightly.json

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mqtt-tls-nightly-logs
          path: mqtt-tls-nightly.json
          retention-days: 7
