name: gocell-local

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gocell
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required}
      POSTGRES_DB: gocell
      GOCELL_APP_PASSWORD: ${GOCELL_APP_PASSWORD:?GOCELL_APP_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocell -d gocell"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # corebundle joins redis netns (shared loopback); primary listener
    # port published HERE because corebundle has no netns of its own.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.migrate
    environment:
      GOCELL_PG_DSN: postgres://gocell:${PG_PASSWORD:?}@postgres:5432/gocell?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  corebundle:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.corebundle
    # Shared netns with redis: corebundle sees Redis at 127.0.0.1:6379,
    # satisfying SEC-FAIL-CLOSED loopback-IP-literal exception in
    # pkg/secutil.ValidateTLSEndpoint. macOS-local equivalent of the e2e
    # harness's `network_mode: host` (Linux-only). Production deployments
    # use managed TLS Redis (rediss://) instead.
    network_mode: "service:redis"
    environment:
      # Adapter wiring
      GOCELL_ADAPTER_MODE: real
      GOCELL_CELL_ADAPTER_MODE: postgres
      GOCELL_SINGLE_POD: "1"

      # Listener binds
      GOCELL_HTTP_PRIMARY_ADDR: "0.0.0.0:8080"
      GOCELL_HTTP_INTERNAL_ADDR: "127.0.0.1:9090"
      GOCELL_HTTP_HEALTH_ADDR: "127.0.0.1:9091"
      GOCELL_HTTP_HEALTH_LOCAL_ONLY: "1"

      # PostgreSQL DSN (shared-netns DNS resolution still uses container names)
      GOCELL_CONFIGCORE_DATABASE_URL: postgres://gocell_app:${GOCELL_APP_PASSWORD:?}@postgres:5432/gocell?sslmode=disable
      GOCELL_CONFIGCORE_KEY_PROVIDER: local-aes

      # Redis loopback via shared netns (see network_mode above)
      GOCELL_REDIS_ADDR: "127.0.0.1:6379"

      # JWT identity (keypair itself is ephemeral, generated by Dockerfile startup)
      GOCELL_JWT_ISSUER: gocell-local
      GOCELL_JWT_AUDIENCE: gocell-local-clients

      # Map short .env.local names to corebundle env contract. Indirection lets
      # .env.local stay human-friendly (`SERVICE_SECRET=...`) while corebundle
      # reads its formal `GOCELL_*` names.
      GOCELL_CONFIGCORE_MASTER_KEY: ${CONFIGCORE_MASTER_KEY:?}
      GOCELL_CONFIGCORE_CURSOR_KEY: ${CONFIGCORE_CURSOR_KEY:?}
      GOCELL_AUDITCORE_HMAC_KEY: ${AUDITCORE_HMAC_KEY:?}
      GOCELL_AUDITCORE_CURSOR_KEY: ${AUDITCORE_CURSOR_KEY:?}
      GOCELL_ACCESSCORE_CURSOR_KEY: ${ACCESSCORE_CURSOR_KEY:?}
      GOCELL_ACCESSCORE_IP_HASH_SALT: ${ACCESSCORE_IP_HASH_SALT:?}
      GOCELL_SERVICE_SECRET: ${SERVICE_SECRET:?}
      GOCELL_METRICS_TOKEN: ${METRICS_TOKEN:?}
      GOCELL_READYZ_VERBOSE_TOKEN: ${READYZ_VERBOSE_TOKEN:?}
      GOCELL_BOOTSTRAP_ADMIN_USERNAME: ${OPS_USER:?}
      GOCELL_BOOTSTRAP_ADMIN_PASSWORD: ${OPS_PASS:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9091/readyz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  pgdata:
