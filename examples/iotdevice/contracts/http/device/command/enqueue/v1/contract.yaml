# commandType made required in-place on active v1 (#1694 F9); 429 added in-place
# for the per-device Pending command cap (F-S-005 #822) — both permitted by the
# Pre-GA wire-break window in .claude/rules/gocell/api-versioning.md §兼容窗口
# (until 2026-12-31; no external wire consumers). After the window, breaking wire
# changes rev the version dir.
id: http.device.command.enqueue.v1
kind: http
ownerCell: devicecell
consistencyLevel: L4
lifecycle: active
endpoints:
  server: devicecell
  clients:
    - edge-bff
  http:
    method: POST
    path: /api/v1/devices/{id}/commands
    pathParams:
      id:
        type: string
        minLength: 1
        maxLength: 256
    successStatus: 201
    permission: device:command
    noContent: false
    responses:
      400:
        description: "Bad request — malformed JSON body or oversized payload"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      429:
        description: "Too Many Requests — device exceeded its pending command limit"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
