id: grpc.device.command.v1
kind: grpc
ownerCell: devicecell
consistencyLevel: L4
lifecycle: active
endpoints:
  server: devicecell
  clients: []
  grpc:
    service: device.command.v1.DeviceCommandService
    proto: contracts/grpc/device/command/v1/device_command.proto
    # Per-method ABAC permission overlay (#2008, #2207). IssueCommand is gated on
    # device:command (admin/operator coarse baseline — the same gate the HTTP
    # devicecommand enqueue route uses). WatchCommands is gated on device:consume
    # (owner-scoped): admin/operator OR the device itself (subject == resource). The
    # `resource: device_id` selector tells the interceptor to extract the per-message
    # device_id field and forward it as the PDP resource (the gRPC analog of HTTP
    # RequirePermissionForResource), so a device can watch its OWN command queue.
    # WatchCommands is the real-time NOTIFICATION arm of the device:consume lifecycle
    # (the umbrella gate the HTTP dequeue/ack/report path also uses); the device still
    # claims + executes commands via HTTP Dequeue — the stream is read-only and does
    # not lease. The interceptor PDP gate enforces this; the handler no longer
    # hand-authorizes. Strict fail-closed: every non-public RPC must appear here
    # (completeness pre-pass), else a dead 403; an owner-scoped permission MUST carry a
    # resource selector (cellgen cross-check) or the device owner is silently locked out.
    methods:
      - name: IssueCommand
        permission: device:command
      - name: WatchCommands
        permission: device:consume
        # resource: device_id names the proto request-message field the interceptor
        # extracts per-message and forwards as the PDP resource. device_id is the
        # proto field name (snake_case) — the gRPC equivalent of the HTTP deviceId
        # path param. To determine whether a permission is owner-scoped (and thus
        # requires a resource selector), see authz.Permission.IsOwnerScoped() in
        # framework/pkg/authz/permission.go.
        resource: device_id
