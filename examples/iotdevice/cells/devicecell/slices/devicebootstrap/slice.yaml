id: devicebootstrap
belongsToCell: devicecell
consistencyLevel: L4
lifecycle: experimental
contractUsages:
  - contract: event.device-registered.v1
    role: subscribe
    handler: HandleDeviceRegistered
  - contract: command.devicecommand.enqueue.v1
    role: invoke
verify:
  unit:
    - unit.devicebootstrap.service
  contract:
    - contract.event.device-registered.v1.subscribe
  waivers:
    - contract: command.devicecommand.enqueue.v1
      owner: examples
      reason: >-
        invoke is a declaration-only role (no cellgen derivation, no executable
        broker contract test); the command emit is covered by the slice unit
        test asserting the emitted entry's routing topic + idempotency metadata.
      expiresAt: "2026-12-31"

allowedFiles:
  - examples/iotdevice/cells/devicecell/slices/devicebootstrap/**
