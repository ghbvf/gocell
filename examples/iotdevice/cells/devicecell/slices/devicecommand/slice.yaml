id: devicecommand
belongsToCell: devicecell
consistencyLevel: L4
lifecycle: experimental
contractUsages:
  - contract: http.device.command.enqueue.v1
    role: serve
  - contract: http.device.command.dequeue.v1
    role: serve
  - contract: http.device.command.report.v1
    role: serve
  - contract: http.device.command.ack.v1
    role: serve
  - contract: http.device.command.extend-lease.v1
    role: serve
  - contract: command.devicecommand.enqueue.v1
    role: handle
  - contract: command.devicecommand.dequeue.v1
    role: handle
  - contract: command.devicecommand.report.v1
    role: handle
  - contract: command.devicecommand.ack.v1
    role: handle
  - contract: command.devicecommand.extend-lease.v1
    role: handle
verify:
  unit:
    - unit.devicecommand.service
  contract:
    - contract.http.device.command.enqueue.v1.serve
    - contract.http.device.command.dequeue.v1.serve
    - contract.http.device.command.report.v1.serve
    - contract.http.device.command.ack.v1.serve
    - contract.http.device.command.extend-lease.v1.serve
    - contract.command.devicecommand.enqueue.v1.handle
    - contract.command.devicecommand.dequeue.v1.handle
    - contract.command.devicecommand.report.v1.handle
    - contract.command.devicecommand.ack.v1.handle
    - contract.command.devicecommand.extend-lease.v1.handle

allowedFiles:
  - examples/iotdevice/cells/devicecell/slices/devicecommand/**
