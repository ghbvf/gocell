id: http.order.get.v1
kind: http
ownerCell: ordercell
consistencyLevel: L2
lifecycle: active
endpoints:
  server: ordercell
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/orders/{id}
    pathParams:
      id:
        type: string
        minLength: 1
        maxLength: 256
    successStatus: 200
    noContent: false
    responses:
      400:
        description: "Bad request — invalid pagination parameter"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      # 404 is the handler-level not-found semantic (matches the corecells owner-scoped
      # precedent http.auth.user.get.v1). In production this endpoint is owner-scoped
      # (gate RequirePermissionForResource → PDP PIP lookup), so a missing/non-owned id
      # is denied at the gate with 403 (uniform for "missing"/"not yours", avoiding an
      # existence side-channel) and the 404 is shadowed — it is reachable only when the
      # handler is exercised without the gate.
      404:
        description: "Not found — order with given id does not exist"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
