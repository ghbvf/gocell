id: orderprojection
belongsToCell: ordercell
consistencyLevel: L3

contractUsages:
  - contract: event.order-created.v1
    role: subscribe
  - contract: event.order-status-changed.v1
    role: subscribe
  - contract: projection.order.status-summary.v1
    role: provide
  - contract: http.order.projection-summary.v1
    role: serve
  - contract: http.order.projection-rebuild.v1
    role: serve

verify:
  unit:
    - unit.orderprojection.service
  contract:
    - contract.event.order-created.v1.subscribe
    - contract.event.order-status-changed.v1.subscribe
    - contract.projection.order.status-summary.v1.provide
    - contract.http.order.projection-summary.v1.serve
    - contract.http.order.projection-rebuild.v1.serve

allowedFiles:
  - examples/todoorder/cells/ordercell/slices/orderprojection/**
