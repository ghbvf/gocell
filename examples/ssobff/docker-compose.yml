services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sso_bff
      POSTGRES_USER: gocell
      POSTGRES_PASSWORD: ${GOCELL_EXAMPLE_POSTGRES_PASSWORD:?set GOCELL_EXAMPLE_POSTGRES_PASSWORD for local demo infrastructure}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocell"]
      interval: 5s
      timeout: 3s
      retries: 5

  # redis + rabbitmq back the MULTI-POD topology only (GOCELL_ADAPTER_MODE=real
  # + GOCELL_CELL_ADAPTER_MODE=postgres): the distributed idempotency claimer +
  # service-token nonce store (GOCELL_REDIS_ADDR) and the durable event transport
  # (GOCELL_AMQP_URL). The default single-pod demo path uses in-process backends
  # and needs neither — see README §"Multi-pod deployment".
  redis:
    image: redis:7-alpine
    # Server-side auth (requirepass) MUST match the app's GOCELL_REDIS_PASSWORD
    # in multi-pod topology — replaydeps/adapters/redis fail-fast without a
    # credential in real multi-pod, so a no-password Redis would make the README
    # multi-pod path unreproducible (F2). README binds GOCELL_REDIS_PASSWORD to
    # this same GOCELL_EXAMPLE_REDIS_PASSWORD value.
    command:
      - "redis-server"
      - "--requirepass"
      - "${GOCELL_EXAMPLE_REDIS_PASSWORD:?set GOCELL_EXAMPLE_REDIS_PASSWORD for local demo infrastructure}"
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck authenticates without
      # putting the password on the command line.
      REDISCLI_AUTH: ${GOCELL_EXAMPLE_REDIS_PASSWORD:?set GOCELL_EXAMPLE_REDIS_PASSWORD for local demo infrastructure}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: gocell
      RABBITMQ_DEFAULT_PASS: ${GOCELL_EXAMPLE_RABBITMQ_PASSWORD:?set GOCELL_EXAMPLE_RABBITMQ_PASSWORD for local demo infrastructure}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
