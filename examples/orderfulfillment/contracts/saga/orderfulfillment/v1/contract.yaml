id: saga.orderfulfillment.v1
kind: saga
ownerCell: orderfulfillmentcell
consistencyLevel: L3
lifecycle: active
endpoints:
  server: orderfulfillmentcell
codegen: true
saga:
  timeout: "30s"
  compensationOrder: reverse
  retries:
    maxAttempts: 3
    baseInterval: "100ms"
  steps:
    - name: reserveInventory
      output: reserve-inventory.output.schema.json
      timeout: "5s"
    - name: chargePayment
      output: charge-payment.output.schema.json
      retries:
        maxAttempts: 2
    - name: ship
      output: ship.output.schema.json
    - name: notifyUser
      output: notify-user.output.schema.json
      compensate: false
