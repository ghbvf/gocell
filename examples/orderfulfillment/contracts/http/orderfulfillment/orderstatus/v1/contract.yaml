id: http.orderfulfillment.orderstatus.v1
kind: http
ownerCell: orderfulfillmentcell
consistencyLevel: L3
lifecycle: active
endpoints:
  server: orderfulfillmentcell
  http:
    method: GET
    path: /api/v1/orders/{id}
    pathParams:
      id:
        type: string
        minLength: 1
        maxLength: 256
        # No format: uuid — order IDs carry an "ord-" prefix and are not bare UUIDs.
        # CH-05 ParseUUIDPathParam is not required when format is omitted.
    successStatus: 200
    noContent: false
    auth:
      public: true  # demo-only: production MUST set public:false + configure a JWT plan. No machine guard exists for this (example scope); see backlog.
      reason: "Demo-only: production MUST set public:false + configure a JWT plan (example scope)."
    responses:
      400:
        description: "Bad request — malformed path parameter or validation failure"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      404:
        description: "Not found — order with the given ID does not exist"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
