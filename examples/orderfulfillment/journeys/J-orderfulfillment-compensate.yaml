id: J-orderfulfillment-compensate
goal: "Place an order with paymentShouldFail=true and observe the saga coordinator compensate in reverse, releasing all acquired resources"
lifecycle: active
owner:
  team: examples
  role: fulfillment-owner
cells:
  - orderfulfillmentcell
contracts:
  - http.orderfulfillment.placeorder.v1
  - saga.orderfulfillment.v1
passCriteria:
  - text: "POST /api/v1/orders/ with paymentShouldFail=true returns 202 Accepted with orderId (enrollment is immediate; compensation is async)"
    mode: manual
  - text: "chargePayment step returns a conflict error; coordinator enters Compensating phase; saga reaches terminal KindSagaCompensated; verified by integration test TestPlaceOrder_CompensateOnChargeFail"
    mode: auto
    checkRef: journey.J-orderfulfillment-compensate.saga-compensated
  - text: "CompensateReserveInventory releases the inventory reservation: Available(widget) returns to its original value"
    mode: auto
    checkRef: journey.J-orderfulfillment-compensate.saga-compensated
  - text: "No payment side-effect persists: PaymentStore has no record for the order after compensation"
    mode: auto
    checkRef: journey.J-orderfulfillment-compensate.saga-compensated
  - text: "No shipment side-effect persists: ShipmentStore has no record for the order (ship step was never reached)"
    mode: auto
    checkRef: journey.J-orderfulfillment-compensate.saga-compensated
