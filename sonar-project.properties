# --- Coverage exclusions ---
#
# outboxtest is a conformance-suite helper package (like go-test's
# testing/iotest) executed by adapter integration tests (RabbitMQ, in-memory
# bus) under -tags=integration. The default build-test job only exercises it
# via fakePubSub shims (see kernel/outbox/outboxtest/helpers_test.go), so
# in-package line coverage does not reflect the package's real exercise
# surface. The kernel coverage gate in .github/workflows/_build-lint.yml
# already skips outboxtest/celltest (via the `/[a-z0-9_]+test$` helper
# exemption regex) with the same rationale; mirror that here to keep
# SonarCloud's new-code metric honest.
#
# runtime/outbox/outboxtest/ is the public in-memory Store + Store conformance
# suite for runtime/outbox. FakeStore is exercised by unit tests (bootstrap,
# relay, etc.) and counts toward those packages' own coverage; however, the
# store_conformance.go suite functions themselves are only called from integration
# tests (adapters/postgres/outbox_store_integration_test.go,
# adapters/rabbitmq/conformance_test.go). The CI integration-test step runs
# without -coverpkg=./... so coverage for the outboxtest package itself is never
# attributed back to suite.go. Same conformance-suite exclusion pattern as
# kernel/outbox/outboxtest above.
#
# runtime/auth/session/storetest/bench.go follows the same conformance-suite
# exclusion principle: NewBenchProtocol / BenchFactory / Bench / mixed concurrent
# benchmark bodies are exercised only by `go test -bench=.` against PG and mem
# backends (adapters/postgres/session_store_integration_test.go +
# runtime/auth/session/mem/store_test.go), not by `go test -count=1` runs that
# feed coverage into Sonar. This mirrors the existing
# kernel/outbox/outboxtest/** exclusion above (PR-V1-PG-STARTUP-HARDEN baseline).
#
# runtime/audit/ledger/storetest/ is a Protocol-driven conformance-suite helper
# (NewTestProtocol / NewEntryFixture / Run) exercised only by backend-specific
# tests (runtime/audit/ledger/mem/store_test.go and future PG integration tests
# under -tags=integration). The default `go test -count=1` run does not exercise
# this package directly; cross-package line hits do not attribute back to suite.go.
# Same conformance-suite exclusion pattern as runtime/auth/session/storetest
# and kernel/outbox/outboxtest above.
#
# runtime/distlock/locktest/conformance.go borrows the same conformance-suite
# exclusion principle but applies only to Sonar — the CI kernel coverage gate
# at .github/workflows/_build-lint.yml parses coverage-shard-kernel.out
# (awk over the per-shard atomic profile) and never reaches runtime/distlock/,
# so there is no in-CI gate to mirror; the
# Sonar exclusion stands alone. Rationale: RunDriverTTLConformance / conformC5
# / conformC6 only run against real backends (adapters/redis integration
# tests) because FakeDriver wired with FakeClock cannot exercise wall-clock
# TTL expiry. Excluded at file level (not package level) so FakeDriver /
# FakeClock in-package unit coverage still counts toward Sonar metrics.
#
# corecells/accesscore/internal/ports/conformance/ is the UserRepository
# conformance suite shared by mem and PG implementations
# (corecells/accesscore/internal/mem/user_repo_conformance_test.go and
# corecells/accesscore/internal/adapters/postgres/user_repo_conformance_integration_test.go).
# Same conformance-suite pattern as outboxtest / celltest / storetest above:
# the helpers are exercised by tests in *other* packages, but per-shard CI
# runs go test *without* -coverpkg=./... (see _build-lint.yml §"-coverpkg=./...
# was previously used here but dropped"), so cross-package line hits never
# attribute back to conformance.go. Excluded at package level — the package
# contains only the conformance suite, no sibling production code.
#
# kernel/command/commandtest/conformance.go follows the same conformance-suite
# exclusion principle as kernel/outbox/outboxtest/**. RunQueueConformance is the
# acceptance test suite for command.Queue/ActiveScanner implementations; its
# error-path branches (t.Fatalf calls after GetCommand/Dequeue/Ack/ScanActive)
# only fire when the underlying store returns unexpected errors — conditions that
# never occur in the InMemQueue unit tests but are exercised by the PG adapter
# integration tests (adapters/postgres/command_queue_integration_test.go).
# Per-shard CI runs go test without -coverpkg=./..., so cross-package line hits
# from the PG integration shard never attribute back to conformance.go.
# Excluded at file level — inmem.go and other helpers in the same package
# are not excluded and continue to count toward Sonar coverage.
#
# runtime/observability/healthz/healthztest/ is the Aggregator conformance-suite
# helper (RunAggregatorConformance + FakeAggregator). Same conformance-suite
# exclusion pattern as kernel/outbox/outboxtest/** above: RunAggregatorConformance
# is exercised only from OTHER packages' tests (runtime/observability/healthz/
# aggregator_test.go and future postgres/otel adapter conformance tests), and
# FakeAggregator is the shared cell-test double exercised by cells/* tests; per-
# shard CI runs go test without -coverpkg=./..., so cross-package line hits never
# attribute back to conformance.go. Excluded at package level — the package is
# pure test-helper, no sibling production code.
#
# kernel/persistence/persistencetest/ is the after-commit hook conformance suite
# (RunAfterCommitConformance + RunAfterCommitNestedConformance). Same
# conformance-suite exclusion pattern as kernel/outbox/outboxtest/** above: the
# suite functions are called only from OTHER packages' tests — the five TxRunner
# implementations (kernel/outbox, corecells/accesscore/internal/mem,
# corecells/configcore/internal/testutil, examples/todoorder, adapters/postgres) —
# and per-shard CI runs go test without -coverpkg=./..., so cross-package line
# hits never attribute back to conformance.go. Excluded at package level — the
# package is pure test-helper, no sibling production code.
#
# kernel/saga/sagajournaltest/ is the saga Journal conformance suite
# (RunConformanceSuite + NewInstanceFixture / NewStepEvent). Same conformance-suite
# exclusion pattern as kernel/persistence/persistencetest/** above: the suite is
# exercised by an in-package self-test (conformance_test.go, mem backend) and by
# future PG integration tests (PR-04). Its error-path branches — the t.Fatalf /
# t.Error guards after every Journal call — only fire on backend faults the
# in-memory backend never produces, so they are structurally unreachable from the
# coverage-feeding run. Excluded at package level — the package is pure test-helper,
# no sibling production code.
#
# kernel/reconcile/reconciletest/ is the LeaderElector + fencing conformance suite
# (RunLeaderConformance / RunFencingConformance) plus the Fake* helpers
# (FakeLeaderElector / FakeLeaseBackend / FakeReconciler / FakeTrigger /
# FakeFencedRepository). Same conformance-suite exclusion pattern as kernel/saga/
# sagajournaltest/** above: the suites + fakes are exercised only from OTHER
# packages' tests (adapters/redis + adapters/postgres reconcile elector tests,
# kernel/reconcile leader/loop tests), so per-shard CI runs (go test without
# -coverpkg=./...) never attribute those cross-package line hits back to
# conformance.go / fake.go — they show 0% new-code coverage despite being fully
# exercised. The reconcile PRODUCTION code (loop.go / leader.go / fenced.go /
# recovery.go + the redis/postgres adapters) is NOT excluded and carries its own
# unit + integration coverage. Excluded at package level — pure test-helper, no
# sibling production code.
#
# kernel/webhook/webhooktest/ is the sign↔verify conformance suite
# (RunSignerVerifierConformance + VerifierFactory) for webhook.Signer/Verifier
# implementations. Same conformance-suite exclusion pattern as kernel/outbox/
# outboxtest/** above: the suite is invoked only from OTHER packages' tests
# (kernel/webhook/conformance_test.go, external webhook_test package; future
# Signer/Verifier implementations add sibling calls), so its line hits attribute
# to the caller package, not back to conformance.go. Per-shard CI runs go test
# without -coverpkg=./..., and the kernel coverage gate in
# .github/workflows/_build-lint.yml already skips it via the `/[a-z0-9_]+test$`
# helper-package regex; mirror that here for SonarCloud new-code honesty. Excluded
# at package level — the package is pure test-helper, no sibling production code.
#
# runtime/observability/metrics/metricstest/ is the Collector conformance suite
# (RunCollectorConformance + CollectorHarness/CollectorObserver). Same
# conformance-suite exclusion pattern as kernel/saga/sagajournaltest/** above:
# conformance.go is published as a plain .go file (not _test.go) so caller
# packages can import it, but its assertion bodies are exercised only from OTHER
# packages' tests (runtime/observability/metrics/{inmemory,provider}_conformance_test.go,
# and future Collector implementations add sibling calls). Per-shard CI runs go
# test without -coverpkg=./..., so cross-package line hits never attribute back to
# conformance.go. Excluded at package level — the package is pure test-helper, no
# sibling production code.
#
# runtime/http/idempotency/idempotencytest/ is the idempotency.Store conformance
# suite (RunConformanceSuite + marshal_helper), same conformance-suite exclusion
# pattern as kernel/outbox/outboxtest/** above: conformance.go is a plain .go file
# (not _test.go) imported by caller packages, exercised only from OTHER packages'
# tests (runtime/http/idempotency/conformance_mem_test.go for MemStore and
# adapters/redis/http_idempotency_conformance_test.go under -tags=integration for
# the Redis store). Per-shard CI runs go test without -coverpkg=./..., so
# cross-package line hits never attribute back to it. Pure test-helper, no sibling
# production code.
#
# Cross-platform stubs and Windows-only code are excluded from Sonar coverage:
# - *_windows.go files compile only on Windows, where the os-smoke matrix runs
#   them but does not feed coverage into Sonar (Linux is the Sonar baseline).
# - *_unsupported.go files are stubs for !unix && !windows (or
#   !linux && !darwin && !windows) targets that no GitHub runner exercises.
#   Including them in the coverage denominator would make the new-code
#   coverage gate impossible to satisfy.
# - platform_supported.go is a one-line `return nil` whose only call site
#   (cells/accesscore/cell_init.go::Init) is exercised by the unix tests, but
#   Sonar's go cover ingestion does not count single-statement function
#   bodies toward coverage. It pairs with platform_unsupported.go (excluded
#   above for build-tag reasons), so excluding both keeps the V-A15 platform
#   guard pair symmetric in the coverage report.
#
# cmd/gocell/main.go is the governance/codegen CLI's thin entry point: it installs
# the redacting slog seal (→ os.Stderr, #1432 C1) then calls os.Exit(
# app.RunWithSignal(...)). os.Exit makes main() unreachable from unit tests, so its
# lines can never accrue coverage. The one meaningful invariant (the seal writes to
# os.Stderr, NOT stdout, so machine output is not corrupted) is locked by
# cmd/gocell/main_seal_test.go::TestMainSealsLogsToStderr — line coverage adds
# nothing. Analogous to the **/examples/** entry-point exclusion below.
sonar.exclusions=\
  **/*_gen.go,\
  **/testdata/**,\
  generated/**,\
  vendor/**

