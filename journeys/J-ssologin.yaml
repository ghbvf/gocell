id: J-ssologin
goal: 用户完成 SSO 登录并获得有效 session
lifecycle: active
owner:
  team: platform
  role: journey-owner
cells:
  - accesscore
  - auditcore
  - configcore
contracts:
  - http.auth.login.v1
  - http.auth.setup.admin.v1
  - http.auth.setup.status.v1
  - http.auth.user.change-password.v1
  - event.session.created.v1
passCriteria:
  - text: OIDC 重定向完成 # Phase 3 OIDC 适配器就绪后验证
    mode: manual
  - text: Session 写入数据库
    mode: auto
    checkRef: journey.J-ssologin.session-db
  - text: 登录失败三态归一 — missing-user / wrong-password / inactive 均返 HTTP 401 同一 envelope (code=ERR_AUTH_LOGIN_FAILED, message="invalid credentials")，防账号枚举
    mode: auto
    checkRef: journey.J-ssologin.error-paths-uniform
  - text: 安全审查签核
    mode: manual
