id: J-auditlogintrail
goal: 登录事件跨 cell 传播并写入审计 hash chain，完整性可验证
lifecycle: active
owner:
  team: platform
  role: journey-owner
cells:
  - accesscore
  - auditcore
contracts:
  - event.session.created.v1
  - event.audit.appended.v1
  # http.audit.list.v1 is listed for journey scope (PR-4 fix/208 reverse
  # cover JOURNEY-CONTRACT-EXISTENCE-01). It has no corresponding
  # passCriteria below — extension is tracked by backlog
  # JOURNEY-AUDITLOGINTRAIL-CRITERIA-EXPANSION-01 (cap-14-tooling.md).
  # Adding a query criterion here without closing that backlog entry is
  # a silent carryover and forbidden.
  - http.audit.list.v1
  # http.audit.get.v1 (#1852, FE-CRUD audit detail) is listed for journey scope
  # alongside http.audit.list.v1 — same JOURNEY-CONTRACT-EXISTENCE-01 reverse cover.
  # It has no corresponding passCriteria below; criteria expansion is tracked by the
  # same backlog JOURNEY-AUDITLOGINTRAIL-CRITERIA-EXPANSION-01. Adding a get-by-id
  # criterion here without closing that backlog entry is a silent carryover and
  # forbidden.
  - http.audit.get.v1
  # event.auth.bootstrap-failed.v1: accesscore publishes on 401/429 from
  # setup/admin; auditcore subscribes and writes bootstrap hash chain.
  # Part of Epic #1423 Wave-1 BootstrapLedgerStore decoupling.
  - event.auth.bootstrap-failed.v1
# passCriteria scope (PR #588): 2 mode:auto criteria cover the publish →
# consume → hash-chain path. A future "accesscore projection" criterion
# (roadmap 029 C6 三段 describe) requires accesscore to subscribe to
# event.audit.appended.v1 first; tracked by backlog
# JOURNEY-AUDITLOGINTRAIL-CRITERIA-EXPANSION-01. Inline criteria expansion
# must close that backlog entry in the same PR.
#
# Wave-1 #1423 addition (criterion 3): covers the async bootstrap-failed path.
# mode:manual because end-to-end relay-subscriber automation hook is not yet
# complete (Epic #1423 Wave-2, backlog JOURNEY-AUDITLOGINTRAIL-BOOTSTRAP-AUTO-01).
# Current partial coverage: setup_integration_test.go covers 401→emit;
# auditappendbootstrap handler unit tests + subscription conformance test
# cover relay→subscriber→chain write. Full auto promotion deferred to Wave-2.
passCriteria:
  - text: session.created 事件被 auditcore 消费
    mode: auto
    checkRef: journey.J-auditlogintrail.event-consume
  - text: 审计记录写入 hash chain
    mode: auto
    checkRef: journey.J-auditlogintrail.hash-chain
  - text: >
      /setup/admin 收到 401/429 后，accesscore 经 L2 outbox 发出
      event.auth.bootstrap-failed.v1；relay 投递至 auditcore；
      auditappendbootstrap subscriber 将 bootstrap.auth.fail 条目写入
      bootstrap-namespace hash chain（namespace="bootstrap"，独立 HMAC key）；
      GET /api/v1/audit/entries?eventType=bootstrap.auth.fail 可查到该条目。
      （端到端自动化待 Wave-2 #1423 落地，backlog JOURNEY-AUDITLOGINTRAIL-BOOTSTRAP-AUTO-01）
    mode: manual
