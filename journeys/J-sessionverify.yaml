id: J-sessionverify
goal: 服务间经 gRPC 校验 access/session token 的有效性（US3 — 平台 Cell service-to-service）
lifecycle: experimental
owner:
  team: platform
  role: journey-owner
cells:
  - accesscore
contracts:
  - grpc.auth.session.verify.v1
passCriteria:
  - text: 已授权调用方（admin/super-admin，或经租户 policy 授予 session:verify 的服务身份）调用 SessionVerifyService.VerifyToken，对有效 access token 返回 valid=true 及 claims 投影（subject/tenantId/sessionId/roles/expiresAt/passwordResetRequired）# corecells/accesscore grpc gate test + corebundle 集成测试覆盖
    mode: manual
  - text: PDP 门禁同构 HTTP — 无 token → Unauthenticated；缺 session:verify 权限 → PermissionDenied（handler 未触达）；由 interceptor PDP gate 而非 handler 谓词执行
    mode: manual
  - text: introspection 语义 — 无效/过期/被撤销/错误 intent 的 token 统一返回 valid=false（不枚举失败原因，防 session 状态枚举）；仅基础设施故障（KindUnavailable）返回 gRPC error
    mode: manual
  - text: 安全审查签核（首个平台 Cell gRPC 暴露：常驻端口 + TLS 姿态）
    mode: manual
