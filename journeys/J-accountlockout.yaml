id: J-accountlockout
goal: 多次登录失败后账户自动锁定，管理员可手动解锁
lifecycle: active
owner:
  team: platform
  role: journey-owner
cells:
  - accesscore
contracts:
  - event.user.locked.v1
  - event.user.unlocked.v1
  - http.auth.user.lock.v1
  - http.auth.user.unlock.v1
passCriteria:
  # PR #585 P2#4 promotion: the auto-lock / event-publish / admin-unlock
  # criteria are now covered by the testcontainers e2e
  # tests/integration/l2atomicity/journey_accountlockout_e2e_test.go
  # (TestJAccountlockoutAutoLockCycle) — this is path (b) from the prior
  # "load-bearing harness" gate: a real wire-level run over PG that drives
  # Threshold wrong-password POSTs → auto-lock → uniform 401 on locked
  # account → admin unlock → post-unlock login succeeds. The single e2e
  # asserts all three criteria as side effects, so they share its checkRef.
  #
  # Lazy-unlock by TTL remains mode: manual until the l2 harness exposes a
  # clock-advance seam (backlog
  # JOURNEY-ACCOUNTLOCKOUT-AUTO-EXPANSION-01-LAZYUNLOCK); LockoutTTL=15min
  # makes a real-time test infeasible in CI.
  - text: 连续失败达阈值后账户锁定
    mode: auto
    checkRef: journey.J-accountlockout.auto-lock-cycle
  - text: user.locked 事件发布成功
    mode: auto
    checkRef: journey.J-accountlockout.auto-lock-cycle
  - text: 锁定期间登录被拒绝 — 锁定账户登录返回 HTTP 401 + code=ERR_AUTH_LOGIN_FAILED + message="invalid credentials"（与 missing-user / wrong-password 归一，防账号枚举）
    mode: auto
    checkRef: journey.J-accountlockout.auto-lock-cycle
  - text: 管理员解锁后可正常登录
    mode: auto
    checkRef: journey.J-accountlockout.auto-lock-cycle
