id: J-grpc-roundtrip
goal: Cell 作者实现 unary gRPC handler；客户端 dial → 完整拦截器链 → handler → 应答；handler 返回的 errcode.Error 以正确映射的 grpc codes.Code 出现在 wire 上（PR-12 #1155 ErrcodeMap 拦截器验收）
lifecycle: experimental
owner:
  team: platform
  role: journey-owner
cells:
  - devicecell
contracts:
  - grpc.device.command.v1
passCriteria:
  - text: unary RPC（IssueCommand）经 bufconn 拨号完成 round-trip，返回应答且无错误；拦截器链全程运行（RequestID 注入 trailer，AccessLog 写结构化日志，Metrics 计数器递增）
    mode: auto
    checkRef: journey.J-grpc-roundtrip.roundtrip
  - text: handler 对缺少必填字段的请求返回 *errcode.Error（KindInvalid）；wire 上出现 codes.InvalidArgument（不是 codes.Unknown）；客户端可 status.FromError 拿到该 code
    mode: auto
    checkRef: journey.J-grpc-roundtrip.errcode-mapping
  - text: 5xx-class 错误（KindInternal）在 wire 上出现 codes.Internal，且 status message 为 generic 常量（不泄露原始错误上下文）；4xx-class 错误 message 与 errcode.Error.Message 一致
    mode: manual
  - text: PDP gate 同构 HTTP — 无 token → Unauthenticated；缺 permission → PermissionDenied；由 Auth 拦截器执行，handler 未触达；denyReason 通过 google.rpc.ErrorInfo detail 机器可读（Reason/Domain/Metadata）
    mode: manual
