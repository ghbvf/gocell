# Illustrative `kind: grpc` contract.yaml — referenced from plan.md and quickstart.md
# This file is not loaded by the runtime; it is documentation of the schema shape.

id: grpc.device.command.v1.IssueCommand
kind: grpc
version: v1
owner: iotdevice
description: |
  Issue a command to a device over RPC. Used by control-plane cells to push
  state changes; replaces the prior HTTP+JSON internal endpoint for this path.

grpc:
  service: device.command.v1.DeviceCommandService
  method: IssueCommand
  streamingType: unary         # one of: unary | server-stream | client-stream | bidi
  proto: contracts/grpc/device/command/v1/device_command.proto
  auth:
    public: false              # service-to-service; not exposed on public listener

verify:
  contract:
    - contract.grpc.device.command.v1.IssueCommand.serve
    - contract.grpc.device.command.v1.IssueCommand.call

# Optional: external actors that consume via RPC client without being a cell
# actorClients:
#   - control-plane-operator
