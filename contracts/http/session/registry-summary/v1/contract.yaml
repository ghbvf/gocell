# consistencyLevel L1 = 读端点单次本地读语义（不 emit）；数据来源是 L3 最终一致投影
# （见 projection.session.registry-summary.v1），读到的计数为最终一致快照。
# L2+ HTTP 契约要求声明 triggers，读端点不 emit，故 L1 是正确且唯一合法值，
# 与 accesscore 既有读端点（如 policy.get）保持一致。
id: http.session.registry-summary.v1
kind: http
ownerCell: accesscore
consistencyLevel: L1
lifecycle: active
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/access/sessions/registry-summary
    successStatus: 200
    auth:
      responses:
        - 503
    noContent: false
    responses:
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — caller lacks the session:read permission (the built-in baseline grants the admin and super-admin roles) or carries no tenant scope (tenant-scoped read fails closed)"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
