id: http.devicestate.v1
kind: http
ownerCell: _framework
consistencyLevel: L0
lifecycle: active
description: |
  Device presence state query — neutral provider-agnostic query for device online/offline state.
  ref: docs/plans/specs/1895-device-identity-cert-framework/spec.md FR-013
  ref: docs/architecture/202606130635-1939-adr-framework-owned-contract.md
endpoints:
  server: _framework
  clients: []
  http:
    method: GET
    path: /api/v1/devicestate
    successStatus: 200
    noContent: false
    responseProjection: true
    queryParams:
      deviceId:
        type: string
        required: true
        maxLength: 256
    responses:
      400:
        description: "Bad request — missing required query parameter or invalid format"
        schemaRef: "../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — authenticated but lacks required permission"
        schemaRef: "../../../shared/errors/error-response-v1.schema.json"
      404:
        description: "Not Found — device not found"
        schemaRef: "../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
