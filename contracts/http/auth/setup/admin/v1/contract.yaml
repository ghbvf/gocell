# Request headers (documentation; contractgen does not yet emit header params —
# tracked in backlog issue "contractgen: support header parameters"):
#
#   X-Tenant-ID  (required)
#     Type:    string (canonical UUID)
#     Source:  HTTP request header; no JWT exists pre-bootstrap so the tenant
#              cannot be derived from bearer token claims.
#     Parsing: tenant.ParseTenantID — fail-closed; malformed or absent UUID
#              → 400 ERR_AUTH_IDENTITY_INVALID_INPUT via service-layer validation
#              on CreateAdminInput.TenantID.
#     Codegen: contractgen client generation does not yet emit this header.
#              Callers must set it manually until the backlog issue is resolved.
id: http.auth.setup.admin.v1
kind: http
ownerCell: accesscore
consistencyLevel: L2
lifecycle: active
triggers:
  - event.user.created.v1
  - event.auth.bootstrap-failed.v1
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: POST
    path: /api/v1/access/setup/admin
    successStatus: 201
    noContent: false
    auth:
      bootstrap: true
      responses:
        - 401
        - 429
    responses:
      400:
        description: "Bad request — missing or blank required fields, oversized username/email, or password outside 8-72 printable ASCII bytes"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      409:
        description: "Conflict — requested first-admin username already belongs to a non-recoverable user or provisioning attempt"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      410:
        description: "Gone — first-run admin already provisioned; endpoint retired for this deployment. Response details carry nextAction=\"login\" only; clients resolve the login endpoint via OpenAPI / contract registry. See docs/architecture/202605061600-adr-bootstrap-admin-boundary.md."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the decode limit"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
