# Request headers (documentation; contractgen does not yet emit header params —
# tracked in backlog issue #1494 "contractgen: support header parameters"):
#
#   X-Tenant-ID  (required)
#     Type:    string (canonical UUID)
#     Source:  HTTP request header; no JWT exists pre-bootstrap so the tenant
#              cannot be derived from bearer token claims.
#     Parsing: tenant.ParseTenantID — fail-closed; malformed or absent UUID
#              → 200 response with hasAdmin:false (same as "not yet provisioned"
#              to prevent tenant enumeration).
#     Codegen: contractgen client generation does not yet emit this header.
#              Callers must set it manually until the backlog issue is resolved.
id: http.auth.setup.status.v1
kind: http
ownerCell: accesscore
consistencyLevel: L0
lifecycle: active
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/access/setup/status
    successStatus: 200
    noContent: false
    auth:
      public: true
    responses:
      400:
        description: "Bad request — malformed JSON body or oversized payload (from co-located setup admin handler)"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit (from co-located setup admin handler)"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      500:
        description: "Internal — provisioner status check failed (e.g. database unreachable). Body is the standard error envelope; the underlying cause is logged at slog.Error and not exposed on the wire."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
