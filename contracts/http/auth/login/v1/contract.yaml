# Request headers (documentation; contractgen does not yet emit header params —
# tracked in backlog issue "contractgen: support header parameters"):
#
#   X-Tenant-ID  (required)
#     Type:    string (canonical UUID)
#     Source:  HTTP request header; no JWT exists pre-login so the tenant
#              cannot be derived from bearer token claims.
#     Parsing: tenant.ParseTenantID — fail-closed; malformed or absent UUID
#              → 401 with non-enumerable response (same shape as wrong-password
#              401) to prevent tenant enumeration by callers.
#     Codegen: contractgen client generation does not yet emit this header.
#              Callers must set it manually until the backlog issue is resolved.
id: http.auth.login.v1
kind: http
ownerCell: accesscore
consistencyLevel: L2
lifecycle: active
triggers:
  - event.session.created.v1
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: POST
    path: /api/v1/access/sessions/login
    successStatus: 201
    auth:
      public: true
    noContent: false
    responses:
      400:
        description: Invalid login request.
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
      401:
        description: "Login failed — uniform response covers missing user / wrong password / inactive account (locked or suspended) to prevent account enumeration. Wire shape: code=ERR_AUTH_LOGIN_FAILED, message=\"invalid credentials\". Server-side slog records the real failure reason via errcode.WithInternal."
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
schemaRefs:
  request: request.schema.json
  response: response.schema.json
