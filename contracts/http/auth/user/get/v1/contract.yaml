id: http.auth.user.get.v1
kind: http
ownerCell: accesscore
consistencyLevel: L1
lifecycle: active
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/access/users/{id}
    pathParams:
      id:
        type: string
        format: uuid
    successStatus: 200
    permission: user:read
    resource: id
    auth:
      responses:
        - 503
    noContent: false
    responseProjection: true
    responses:
      400:
        description: "Bad request — path parameter id is not a valid UUID (ERR_VALIDATION_INVALID_UUID)"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — caller lacks the user:read permission and is not the target user — self-access (subject == resource.id) is granted by the built-in baseline ownership rule via the ABAC PDP (#1977), NOT a request-shape exemption; the baseline also grants user:read to the admin and super-admin roles."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      404:
        description: "Not found — user with given id does not exist"
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      501:
        description: "Not Implemented — a super-admin's principal derives cross-tenant (RowScopeAll) row visibility, but accesscore has no cross-tenant read pool (unlike audit's gocell_audit_admin, #1810): its tables are served only by the app pool under FORCE RLS, so this read fail-closes unconditionally (ports.RowScopeAllUnsupportedError, #1709). Distinct from 404, which signals the specific row is absent."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
