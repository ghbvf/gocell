# Response headers (documentation; codegen does not emit response headers —
# tracked in backlog issue #1494 "contractgen: support header parameters"):
#
#   Set-Cookie: gocell_rt=<refreshToken>; HttpOnly; Secure; SameSite=Strict;
#               Path=/api/v1/access/sessions; Max-Age=<refresh TTL in seconds>
#     Condition: emitted on 200 only (4xx/5xx leave the cookie untouched).
#     Source:    httpcookie.Middleware (cells/accesscore/internal/httpcookie)
#                wraps the response writer and writes the Set-Cookie header
#                before the status is committed.
#
# Refresh token source (cookie-first, body-fallback — BR-005 #1278):
#   1. If the inbound gocell_rt cookie is present its value is used as the
#      refresh token; the request body refreshToken field is ignored.
#   2. Otherwise the body refreshToken field is used.
#   The body field is therefore optional (required:[]) but a cookie-only client
#   MUST still send a valid JSON object body (minimally {}) because the handler
#   still requires a parseable JSON body. Note: {} (absent key) is OK for
#   cookie-only; {"refreshToken":""} is NOT OK — an explicitly empty string
#   violates the schema minLength:20 constraint and yields 400.
id: http.auth.refresh.v1
kind: http
ownerCell: accesscore
consistencyLevel: L1
lifecycle: active
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: POST
    path: /api/v1/access/sessions/refresh
    successStatus: 200
    auth:
      public: true
    idempotency:
      exempt: true
    noContent: false
    responses:
      400:
        description: Invalid refresh request.
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
      401:
        description: "Refresh token rejected — covers all rejection reasons: revoked session, subject mismatch, user-not-active, stale epoch, token reuse. ADR §A13 single envelope: callers cannot distinguish rejection causes from the wire response."
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
      503:
        description: "ERR_SERVICE_UNAVAILABLE - refresh store unavailable. Public message is service unavailable; original internal errcode is logged server-side."
        schemaRef: ../../../../shared/errors/error-response-v1.schema.json
schemaRefs:
  request: request.schema.json
  response: response.schema.json
