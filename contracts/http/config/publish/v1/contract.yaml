id: http.config.publish.v1
kind: http
ownerCell: configcore
consistencyLevel: L2
lifecycle: active
triggers:
  - event.config.version-published.v1
endpoints:
  server: configcore
  clients:
    - edge-bff
  http:
    method: POST
    path: /api/v1/config/{key}/publish
    pathParams:
      key:
        type: string
        minLength: 1
        maxLength: 256
    successStatus: 201
    auth:
      responses:
        - 409
        - 422
        - 503
    noContent: false
    responses:
      400:
        description: "Bad request — path parameter key is too short or too long"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — the ABAC PDP denied the config:publish permission (PR-10b #1348 migrated the role-literal admin gate to permission-based authz; the built-in baseline grants admin/super-admin)"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      404:
        description: "Not Found — config key does not exist (ERR_CONFIG_REPO_NOT_FOUND)"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Request body too large"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
