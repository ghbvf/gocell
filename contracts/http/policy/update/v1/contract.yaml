id: http.policy.update.v1
kind: http
ownerCell: accesscore
consistencyLevel: L2
lifecycle: active
triggers:
  - event.policy.updated.v1
endpoints:
  server: accesscore
  clients:
    - edge-bff
  http:
    method: PUT
    path: /api/v1/access/policies/{id}
    pathParams:
      id:
        type: string
        minLength: 1
        maxLength: 128
    successStatus: 200
    auth:
      responses:
        - 503
    noContent: false
    responses:
      400:
        description: "Bad request — path parameter id fails constraints, malformed JSON body, or field validation error"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — caller lacks the policy:write permission; the built-in baseline grants the admin and super-admin roles."
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      404:
        description: "Not Found — policy with given id does not exist"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      409:
        description: "Conflict — expectedVersion does not match current version (ERR_VERSION_CONFLICT)"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      422:
        description: "Unprocessable Entity — request body is structurally valid JSON but contains semantic validation errors (e.g. null array items, unknown enum values)"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
