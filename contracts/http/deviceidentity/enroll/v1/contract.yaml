id: http.deviceidentity.enroll.v1
kind: http
ownerCell: _framework
consistencyLevel: L1
lifecycle: active
description: |
  Device identity enrollment — issues a signed certificate for a device CSR.
  ref: RFC 7030 §4.2 simpleenroll
  ref: docs/architecture/202606130635-1939-adr-framework-owned-contract.md
  注：同步签发前端；cert-issued outbox emit（升 L2）随 PR-9 #1905 落地。
endpoints:
  server: _framework
  clients: []
  http:
    method: POST
    path: /api/v1/deviceidentity/enroll
    successStatus: 201
    auth:
      public: true
      reason: "Device first-enrollment authenticates with a dedicated enrollment-credential bearer token (auth.TokenIntentEnrollment), verified application-layer by EnrollmentCredentialVerifier — NOT the listener JWT/ABAC route gate (a freshly provisioned device holds no access token). Authorization (device:enroll) is enforced inside the handler via the certsigning Authorizer (PDP), and setup-bootstrap credential reuse is forbidden (EST-ENROLL-AUTH-BOUNDARY-01)."
    noContent: false
    responses:
      400:
        description: "Bad request — malformed JSON body, missing required fields, or field validation error"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — authenticated but lacks required permission"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      409:
        description: "Conflict — device already has an active certificate; use the renew endpoint to rotate. NOTE: 409 is also the idempotency framework status (ClaimBusy, ADR 202606021000-1043); this entry describes the orthogonal business-level meaning. 当前未实现（无持久化 cert store）；blocked-by #1905；当前行为：重复 enroll 继续签发新证书。"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      413:
        description: "Payload Too Large — request body exceeds the size limit"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      422:
        description: "Unprocessable Entity — request body is structurally valid JSON but contains semantic validation errors. NOTE: 422 is also the idempotency framework status (key-reused, ADR 202606021000-1043); this entry describes the orthogonal business-level meaning."
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
      503:
        description: "Service Unavailable — CA backend is not reachable"
        schemaRef: "../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  request: request.schema.json
  response: response.schema.json
