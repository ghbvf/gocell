id: http.registry.contract.list.v1
kind: http
ownerCell: registrycore
consistencyLevel: L0
lifecycle: active
endpoints:
  server: registrycore
  clients:
    - edge-bff
  http:
    method: GET
    path: /api/v1/registry/contracts
    queryParams:
      cursor:
        type: string
        required: false
        maxLength: 4096
      limit:
        type: integer
        required: false
        minimum: 1
        maximum: 500
      # Optional registration-state filter. Omit to return all states.
      # Closed value set (8 values):
      #   submitted | probing | conformant | pending-approval |
      #   approved  | rejected | active    | retired
      # The enum is NOT declared in queryParam schema — metadata.ParamSchema does
      # not model enum/description on params — so the membership check is enforced
      # in the registryread service via registry.ParseState (unknown value → 400),
      # covered by contract tests.
      state:
        type: string
        required: false
        maxLength: 32
    permission: registry:read
    successStatus: 200
    auth:
      responses:
        - 503
    noContent: false
    responseProjection: true
    responses:
      400:
        description: "Bad request — invalid cursor, limit, or state query parameter."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      401:
        description: "Unauthorized — missing or invalid bearer token."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
      403:
        description: "Forbidden — caller lacks the registry:read permission required to list contract registrations."
        schemaRef: "../../../../../shared/errors/error-response-v1.schema.json"
schemaRefs:
  response: response.schema.json
